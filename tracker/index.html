<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fde">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e2e5eb;
    --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f9d55; --err: #d64545; --warn: #c98a00;
    --done-bg: #eaf6ef;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #8d95a7; --line: #2b313d;
      --accent: #5b8ff0; --accent-text: #0d1117; --ok: #3fbf74; --err: #ef6b6b; --warn: #e0a72e;
      --done-bg: #17291f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #login form { width: 100%; max-width: 320px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  #login h1 { margin: 0 0 4px; font-size: 20px; }
  .field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .btn { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .error { color: var(--err); font-size: 14px; min-height: 1.2em; }

  /* app */
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 6px; align-items: center; }
  .bar .field { width: auto; flex: 1 1 auto; min-width: 0; text-align: center; padding: 8px 4px; }
  .bar #today { padding: 10px 10px; }
  .icon { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; flex: none; }
  .btn:disabled { opacity: .35; cursor: default; }
  #status { font-size: 13px; color: var(--muted); white-space: nowrap; margin-left: auto; padding-left: 12px; }
  #status.err { color: var(--err); cursor: pointer; }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  #status { cursor: pointer; }
  .unsent-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: 2px; }
  ul.unsent { margin: 0 0 16px; padding-left: 20px; display: grid; gap: 6px; }
  nav { max-width: 900px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; }
  #tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
  nav button { border: 0; background: none; padding: 10px 12px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  nav .count { font-size: 12px; margin-left: 6px; color: var(--muted); font-weight: 400; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .msg { color: var(--muted); padding: 24px 0; text-align: center; }
  .msg.err { color: var(--err); }
  footer { max-width: 900px; margin: 0 auto; padding: 8px 16px 32px; text-align: center; }
  footer button, .link { background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 6px; }
  footer { display: flex; justify-content: center; gap: 16px; }
  #login .link { justify-self: center; }
  .installed .install { display: none !important; }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text);
    max-width: min(360px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog ol { margin: 0 0 16px; padding-left: 20px; display: grid; gap: 8px; }
  dialog p { margin: 0 0 16px; color: var(--muted); }
  dialog .btn { width: 100%; }
  dialog.cal { width: min(420px, calc(100vw - 32px)); max-width: none; padding: 16px; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  dialog .cal-head .btn { width: 40px; flex: none; }
  .cal-head h2 { flex: 1; margin: 0; text-align: center; font-size: 17px; text-transform: capitalize; }
  .cal-tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .cal-tabs button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
  .cal-tabs button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 2px; }
  .cal-grid .wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; text-transform: capitalize; }
  .cal-day { position: relative; aspect-ratio: 1; border: 0; background: none; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  .cal-day svg { position: absolute; inset: 6%; width: 88%; height: 88%; transform: rotate(-90deg); }
  .cal-day .track { stroke: var(--line); }
  .cal-day .arc { stroke: var(--accent); transition: stroke-dasharray .2s; }
  .cal-day.full .arc { stroke: var(--ok); }
  .cal-day.full { background: var(--done-bg); }
  .cal-day span { position: relative; font-size: 14px; font-variant-numeric: tabular-nums; }
  .cal-day.today span { font-weight: 700; color: var(--accent); }
  .cal-day.selected { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-day:disabled { opacity: .3; cursor: default; }
  .cal-day.future { opacity: .55; }
  .cal-day.unknown .track { stroke-dasharray: 2 3; }
  .cal-day .unsent-dot { position: absolute; top: 2px; right: 4px; margin: 0; }
  .cal-summary { text-align: center; margin: 12px 0; font-size: 14px; }
  .glyph { display: inline-block; vertical-align: -3px; width: 18px; height: 18px; color: var(--accent); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  thead th { font-size: 13px; color: var(--muted); font-weight: 600; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
  tbody th { font-weight: 500; }
  tr.done { background: var(--done-bg); }
  td.bool { width: 1%; text-align: center; cursor: pointer; }
  td input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--ok); cursor: pointer; }
  td .field { padding: 7px 9px; min-width: 70px; }

  /* celebrations: trophy / welcome back */
  dialog.cheer { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 16px; border: 0;
    background: transparent; place-items: center; overflow: hidden; }
  dialog.cheer[open] { display: grid; }
  dialog.cheer::backdrop { background: rgba(10, 14, 22, .6); }
  dialog.cheer.back::backdrop { background: rgba(10, 14, 22, .45); }
  .cheer-card { position: relative; z-index: 1; width: min(340px, 100%); background: var(--card); border: 1px solid var(--line);
    border-radius: 22px; padding: 20px 20px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    animation: cheer-in .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .cheer.back .cheer-card { animation: cheer-fade .9s ease-out both; }
  .cheer-art { width: 150px; height: 150px; margin: -6px auto 4px; position: relative; }
  .cheer.whole .cheer-art { width: 172px; height: 172px; }
  .cheer-art::before { content: ''; position: absolute; inset: -10%; border-radius: 50%; z-index: -1;
    background: repeating-conic-gradient(from 0deg, rgba(245, 180, 23, .22) 0 10deg, transparent 10deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 35%, transparent 70%); mask: radial-gradient(circle, #000 35%, transparent 70%);
    animation: cheer-spin 14s linear infinite; }
  .cheer.back .cheer-art::before { display: none; }
  .cheer-art svg { width: 100%; height: 100%; overflow: visible; }
  .trophy { animation: trophy-pop .8s cubic-bezier(.2, 1.6, .4, 1) .1s both, trophy-float 3s ease-in-out 1s infinite; transform-origin: 50% 90%; }
  .trophy .shine { animation: trophy-shine 2.6s ease-in-out .9s infinite; }
  .trophy .sparkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.6s ease-in-out infinite; }
  .sunrise .sun { animation: sun-rise 1.8s cubic-bezier(.2, .8, .3, 1) both; }
  .sunrise .rays { transform-box: view-box; transform-origin: 60px 80px; animation: cheer-spin 30s linear infinite; }
  .sunrise .cloud { animation: cloud-drift 6s ease-in-out infinite alternate; }
  .sunrise .sprout { transform-box: fill-box; transform-origin: 50% 100%; animation: sprout-grow 1.4s ease-out .8s both; }
  .cheer-ribbon { display: inline-block; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 13px;
    letter-spacing: .04em; text-transform: uppercase; padding: 4px 14px; border-radius: 999px; margin-bottom: 6px; }
  .cheer-ribbon:empty { display: none; }
  dialog .cheer-card h2 { margin: 2px 0 6px; font-size: 20px; }
  .cheer-count { display: flex; flex-direction: column; align-items: center; line-height: 1; margin: 6px 0 4px; }
  .cheer-count:empty { display: none; }
  .cheer-count b { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--accent);
    animation: count-pop .6s cubic-bezier(.2, 1.6, .4, 1) .35s both; }
  .cheer-count span { font-size: 15px; color: var(--muted); margin-top: 4px; }
  dialog .cheer-sub { margin: 0 0 6px; font-size: 13px; }
  .cheer-sub:empty { display: none; }
  dialog .cheer-text { color: var(--text); font-size: 17px; margin: 10px 0 16px; text-wrap: balance; }
  .cheer-fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .cheer-fx i { position: absolute; top: -20px; left: var(--x); width: 8px; height: 12px; border-radius: 2px; opacity: 0;
    animation: confetti var(--d) cubic-bezier(.3, .6, .6, 1) var(--delay) forwards; }
  .cheer.back .cheer-fx i { top: auto; bottom: -20px; width: 10px; height: 10px; border-radius: 50%; filter: blur(1px);
    animation: float-up var(--d) ease-in-out var(--delay) infinite; }
  @keyframes cheer-in { from { opacity: 0; transform: scale(.7) translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes cheer-fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes cheer-spin { to { transform: rotate(360deg); } }
  @keyframes trophy-pop { 0% { transform: scale(.2) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.12) rotate(4deg); opacity: 1; } 100% { transform: none; } }
  @keyframes trophy-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes trophy-shine { 0% { transform: skewX(-20deg) translateX(-30px); } 45%, 100% { transform: skewX(-20deg) translateX(140px); } }
  @keyframes twinkle { 0%, 100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }
  @keyframes count-pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sun-rise { from { transform: translateY(34px); } to { transform: none; } }
  @keyframes cloud-drift { from { transform: translateX(-4px); } to { transform: translateX(8px); } }
  @keyframes sprout-grow { from { transform: scale(0); } to { transform: none; } }
  @keyframes confetti { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 85% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), 105vh) rotate(var(--rot)); } }
  @keyframes float-up { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: .7; } 80% { opacity: .5; }
    100% { opacity: 0; transform: translate(var(--dx), -70vh); } }
  @media (prefers-reduced-motion: reduce) {
    .cheer-card, .cheer-art::before, .cheer-art svg, .cheer-art svg *, .cheer-count b { animation: none !important; }
    .trophy .shine { display: none; }
  }

  /* phones: rows become cards */
  @media (max-width: 560px) {
    table, tbody, tr, th, td { display: block; }
    table { background: none; border: 0; }
    thead { display: none; }
    tbody tr { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px;
      padding: 4px 0; display: flex; flex-wrap: wrap; align-items: center; }
    tbody tr.done { background: var(--done-bg); }
    tbody th { flex: 1 1 auto; border: 0; padding: 10px 12px; }
    td { border: 0; padding: 6px 12px; }
    td.bool { width: auto; order: -1; flex: none; padding-right: 0; }
    tr.has-inputs td:not(.bool) { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; }
    tr.has-inputs td:not(.bool)::before { content: attr(data-label); color: var(--muted); font-size: 13px; flex: 0 0 40%; }
    td .field { flex: 1; }
  }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form id="loginForm" autocomplete="on">
    <h1>Tracker</h1>
    <input type="text" name="username" value="tracker" autocomplete="username" class="hidden" aria-hidden="true">
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="loginError" class="error"></div>
    <button type="button" class="link install">Install app</button>
  </form>
</section>

<dialog id="installDialog">
  <h2>Install Tracker</h2>
  <div id="installBody"></div>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>

<dialog id="calDialog" class="cal">
  <div class="cal-head">
    <button class="btn icon" id="calPrev" aria-label="Previous month">‹</button>
    <h2 id="calTitle"></h2>
    <button class="btn icon" id="calNext" aria-label="Next month">›</button>
  </div>
  <div id="calTabs" class="cal-tabs"></div>
  <div id="calGrid" class="cal-grid"></div>
  <p id="calSummary" class="cal-summary"></p>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>

<dialog id="syncDialog">
  <h2>Sync</h2>
  <div id="syncBody"></div>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>

<dialog id="cheer" class="cheer" aria-labelledby="cheerTitle" lang="uk">
  <div id="cheerFx" class="cheer-fx" aria-hidden="true"></div>
  <div class="cheer-card">
    <div id="cheerArt" class="cheer-art"></div>
    <div id="cheerRibbon" class="cheer-ribbon"></div>
    <h2 id="cheerTitle"></h2>
    <div id="cheerCount" class="cheer-count"></div>
    <p id="cheerSub" class="cheer-sub"></p>
    <p id="cheerText" class="cheer-text"></p>
    <form method="dialog"><button class="btn primary" id="cheerOk">Дякую!</button></form>
  </div>
</dialog>

<section id="app" class="hidden">
  <header>
    <div class="bar">
      <button class="btn icon" id="prev" aria-label="Previous day">‹</button>
      <input id="date" class="field" type="date" required>
      <button class="btn icon" id="next" aria-label="Next day">›</button>
      <button class="btn" id="today">Today</button>
      <button class="btn icon" id="calendar" aria-label="Month calendar" title="Month calendar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      </button>
    </div>
    <nav><div id="tabs"></div><span id="status"></span></nav>
  </header>
  <main id="content"><div class="msg">Loading…</div></main>
  <footer><button class="install">Install app</button><button id="logout">Sign out</button></footer>
</section>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzRz0gH48TZjfWbkaXBuReyH-5GTAystMgLwJGk4mlro5t06zjelHqYvc57VXr3QsTJ/exec"; // set by scripts/build-pwa.mjs for the standalone PWA

// ---------- storage / transport ----------
const store = {
  get(k) { try { return localStorage.getItem('tracker.' + k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('tracker.' + k) : localStorage.setItem('tracker.' + k, v); } catch (e) {} },
};

function call(fn, args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).rpc(fn, args));
  }
  if (!API_URL) return Promise.reject(new Error('API_URL is not configured'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request: no CORS preflight
    body: JSON.stringify({ fn, args }),
  }).then(r => r.json()).then(r => r.ok ? r.result : Promise.reject(new Error(r.error)));
}

const errText = e => {
  const s = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
  return /Failed to fetch|NetworkError|Load failed|network/i.test(s) ? 'No connection' : s;
};
const isAuthError = e => errText(e).includes('AUTH_REQUIRED');

// ---------- dates ----------
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
function shiftISO(s, days) {
  const [y, m, d] = s.split('-').map(Number);
  return iso(new Date(y, m - 1, d + days));
}

// ---------- state ----------
const $ = id => document.getElementById(id);
const state = { token: store.get('token'), date: todayISO(), followToday: true, tabs: [], active: store.get('tab') };

// ---------- local cache (works offline) ----------
// config: { startDate, pwaUrl, tabs: [{ name, labelHeader, columns, rows }] }  last config from the server
// days:   { date: { tab: { v: values, dirty?: rev, err?: text } } }           dirty = not sent yet
// synced: { from, to }   range covered by the last successful sync (missing days there are empty)
// known:  { date: true } single days fetched outside that range
// daily:  { date: { all, tabs: { name: streak }, brk } }  streaks stored on the Daily sheet
// best:   { '': n, tab: n }  best streaks over days before synced.from; bestFor: same, keyed by a range sync's `from`
// lastActive: latest day with marks before synced.from
// cheered: { 'date|scope': true }  celebrations already shown on this device
const KEEP_DAYS = 31;
const readJSON = k => { try { return JSON.parse(store.get(k) || 'null'); } catch (e) { return null; } };
const cache = { config: readJSON('config'), days: readJSON('days') || {}, synced: readJSON('synced'), known: readJSON('known') || {},
  daily: readJSON('daily') || {}, best: readJSON('best'), bestFor: readJSON('bestFor') || {}, lastActive: store.get('lastActive') || '',
  phrases: readJSON('phrases'), phrasesHash: store.get('phrasesHash') || '', cheered: readJSON('cheered') || {} };
function saveCache() {
  store.set('config', JSON.stringify(cache.config));
  store.set('days', JSON.stringify(cache.days));
  store.set('synced', JSON.stringify(cache.synced));
  store.set('known', JSON.stringify(cache.known));
  store.set('daily', JSON.stringify(cache.daily));
  store.set('best', JSON.stringify(cache.best));
  store.set('bestFor', JSON.stringify(cache.bestFor));
  store.set('lastActive', cache.lastActive || null);
  store.set('cheered', JSON.stringify(cache.cheered));
}
let revSeq = Date.now();
const nextRev = () => ++revSeq;
const minDate = () => (cache.config && cache.config.startDate) || '';
const emptyCell = col => col.type === 'bool' ? false : '';

/** Cached values for a day, fitted to the current config (new rows/columns are empty). */
function valuesFor(date, tab) {
  const rec = (cache.days[date] || {})[tab.name];
  return tab.rows.map((_, i) => tab.columns.map((col, j) => {
    const v = rec && rec.v[i] ? rec.v[i][j] : undefined;
    return v === undefined || v === null ? emptyCell(col) : v;
  }));
}

function dayKnown(date) {
  const s = cache.synced;
  return !!(cache.days[date] || cache.known[date] || (s && date >= s.from && date <= s.to));
}

function dirtyList() {
  const out = [];
  Object.keys(cache.days).sort().forEach(date => Object.keys(cache.days[date]).forEach(tab => {
    const rec = cache.days[date][tab];
    if (rec.dirty) out.push({ date, tab, rec });
  }));
  return out;
}

/** Drops clean days older than the cache window. Unsent days are always kept. */
function prune() {
  const oldest = shiftISO(todayISO(), -KEEP_DAYS);
  Object.keys(cache.days).forEach(date => {
    if (date >= oldest) return;
    Object.keys(cache.days[date]).forEach(tab => { if (!cache.days[date][tab].dirty) delete cache.days[date][tab]; });
    if (!Object.keys(cache.days[date]).length) delete cache.days[date];
  });
  Object.keys(cache.known).forEach(date => { if (date < oldest) delete cache.known[date]; });
  const before = shiftISO(oldest, -1); // the window's first day still needs its yesterday
  Object.keys(cache.daily).forEach(date => { if (date < before) delete cache.daily[date]; });
  Object.keys(cache.bestFor).forEach(date => { if (date < oldest) delete cache.bestFor[date]; });
  Object.keys(cache.cheered).forEach(k => { if (k.slice(0, 10) < oldest) delete cache.cheered[k]; });
}

// ---------- login ----------
function showLogin(msg) {
  state.token = null; store.set('token', null);
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('loginError').textContent = msg || '';
  $('password').focus();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  try {
    const { token } = await call('login', { password: $('password').value });
    state.token = token; store.set('token', token);
    $('password').value = '';
    showApp();
  } catch (err) {
    $('loginError').textContent = errText(err);
  }
});

$('logout').addEventListener('click', () => {
  const n = dirtyList().length;
  if (n && !confirm(n + ' change(s) are not sent yet. They stay on this device and are sent after you sign in again. Sign out?')) return;
  showLogin();
});

// ---------- app ----------
function showApp() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  setDate(todayISO(), true);
  sync();
}

function setDate(date, noFetch) {
  if (!date) return;
  if (minDate() && date < minDate()) date = minDate();
  state.date = date;
  state.followToday = date === todayISO();
  $('date').value = date;
  updateDateLimits();
  render();
  if (!noFetch && !dayKnown(date)) sync({ from: date, to: date });
}

function updateDateLimits() {
  $('date').min = minDate();
  $('prev').disabled = !!minDate() && state.date <= minDate();
}

/** Builds the view for the selected day from the cache. */
function render() {
  const content = $('content');
  if (!cache.config) {
    content.innerHTML = '';
    const m = document.createElement('div');
    m.className = 'msg' + (net.error ? ' err' : '');
    m.textContent = net.error ? 'Can\'t load the app data: ' + net.error : 'Loading…';
    if (net.error) {
      const retry = document.createElement('div');
      retry.innerHTML = '<button class="btn" style="margin-top:12px">Retry</button>';
      retry.firstChild.onclick = () => sync();
      m.appendChild(retry);
    }
    content.appendChild(m);
    $('tabs').innerHTML = '';
    updateStatus();
    return;
  }
  state.tabs = cache.config.tabs.map(t => Object.assign({}, t, { values: valuesFor(state.date, t) }));
  if (!state.tabs.some(t => t.name === state.active)) state.active = state.tabs[0] && state.tabs[0].name;
  renderTabs(); renderTable(); updateStatus();
}

$('prev').onclick = () => setDate(shiftISO(state.date, -1));
$('next').onclick = () => setDate(shiftISO(state.date, 1));
$('today').onclick = () => setDate(todayISO());
$('date').onchange = e => setDate(e.target.value);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !state.token) return;
  // Opened on another day (app left running overnight): jump to the new today.
  if (state.followToday && state.date !== todayISO()) setDate(todayISO());
  sync();
});
window.addEventListener('online', () => state.token && sync());
setInterval(() => { if (state.token && dirtyList().length) sync(); }, 30000);

// ---------- rendering (driven entirely by the config sheet) ----------
// Hidden rows/columns (set on the config sheet) stay in the data but aren't shown or counted.
const shownRows = tab => tab.rows.map((_, i) => i).filter(i => !(tab.hiddenRows && tab.hiddenRows[i]));
const shownCols = tab => tab.columns.map((_, j) => j).filter(j => !tab.columns[j].hidden);
const boolCols = tab => shownCols(tab).filter(j => tab.columns[j].type === 'bool');

/** Whether a row counts as done: all its checkboxes ticked; rows without checkboxes: anything filled in. */
function rowComplete(tab, row) {
  const bools = boolCols(tab);
  return bools.length ? bools.every(j => row[j] === true) : shownCols(tab).some(j => row[j] !== '' && row[j] !== false);
}

function boolProgress(tab) {
  if (!boolCols(tab).length) return '';
  const rows = shownRows(tab);
  return rows.filter(i => rowComplete(tab, tab.values[i])).length + '/' + rows.length;
}

function rowDone(tab, i) {
  return boolCols(tab).length > 0 && rowComplete(tab, tab.values[i]);
}

function renderTabs() {
  const nav = $('tabs');
  nav.innerHTML = '';
  state.tabs.forEach(tab => {
    const b = document.createElement('button');
    b.textContent = tab.name;
    const p = boolProgress(tab);
    if (p) { const s = document.createElement('span'); s.className = 'count'; s.textContent = p; b.appendChild(s); }
    const rec = (cache.days[state.date] || {})[tab.name];
    if (rec && rec.dirty) { const s = document.createElement('span'); s.className = 'unsent-dot'; s.title = 'Not sent yet'; b.appendChild(s); }
    b.className = tab.name === state.active ? 'active' : '';
    b.onclick = () => { state.active = tab.name; store.set('tab', tab.name); renderTabs(); renderTable(); };
    nav.appendChild(b);
  });
}

function makeInput(col, value, onChange) {
  let el;
  switch (col.type) {
    case 'bool':
      el = document.createElement('input');
      el.type = 'checkbox'; el.checked = value === true;
      el.onchange = () => onChange(el.checked, 300);
      return el;
    case 'select':
      el = document.createElement('select');
      el.className = 'field';
      ['', ...col.options].forEach(o => { const opt = document.createElement('option'); opt.value = opt.textContent = o; el.appendChild(opt); });
      if (value !== '' && !col.options.includes(String(value))) {
        const opt = document.createElement('option'); opt.value = opt.textContent = value; el.appendChild(opt);
      }
      el.value = String(value);
      el.onchange = () => onChange(el.value, 300);
      return el;
    default:
      el = document.createElement('input');
      el.className = 'field';
      el.type = { time: 'time', date: 'date' }[col.type] || 'text';
      if (col.type === 'number') el.inputMode = 'decimal';
      el.value = value === null || value === undefined ? '' : String(value);
      el.oninput = () => onChange(el.value, 1500);
      el.onchange = () => onChange(el.value, 300);
      return el;
  }
}

function renderTable() {
  const tab = state.tabs.find(t => t.name === state.active);
  const content = $('content');
  content.innerHTML = '';
  if (!tab) { content.innerHTML = '<div class="msg">No tabs configured on the first sheet.</div>'; return; }
  if (!dayKnown(state.date)) {
    content.innerHTML = '<div class="msg">' + (net.busy || !net.error ? 'Loading…' :
      'This day isn\'t stored on this device. Connect to the internet to load it.') + '</div>';
    return;
  }

  if (!shownRows(tab).length) { content.innerHTML = '<div class="msg">All rows of this tab are hidden on the config sheet.</div>'; return; }

  const table = document.createElement('table');
  const thead = table.createTHead().insertRow();
  const cols = shownCols(tab);
  [tab.labelHeader, ...cols.map(j => tab.columns[j].name)].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; thead.appendChild(th);
  });
  const tbody = table.createTBody();
  const hasInputs = cols.some(j => tab.columns[j].type !== 'bool');

  shownRows(tab).forEach(i => {
    const label = tab.rows[i];
    const tr = tbody.insertRow();
    tr.classList.toggle('has-inputs', hasInputs);
    tr.classList.toggle('done', rowDone(tab, i));
    const th = document.createElement('th'); th.textContent = label; tr.appendChild(th);
    cols.forEach(j => {
      const col = tab.columns[j];
      const td = tr.insertCell();
      td.dataset.label = col.name;
      if (col.type === 'bool') td.className = 'bool';
      const input = makeInput(col, tab.values[i][j], (v, delay) => {
        tab.values[i][j] = v;
        if (col.type === 'bool') { tr.classList.toggle('done', rowDone(tab, i)); renderTabs(); }
        edited(tab, delay);
      });
      if (col.type === 'bool') td.onclick = e => { if (e.target !== input) input.click(); };
      td.appendChild(input);
    });
  });
  content.appendChild(table);
}

// ---------- editing + sync ----------
/**
 * Called on every edit: stores it locally (marked unsent) and schedules a sync.
 * delay <= 300 means a finished edit (checkbox, select, field left), which may show a celebration.
 */
function edited(tab, delay) {
  const date = state.date;
  const before = progressSnapshot(date, tab.name);
  const day = cache.days[date] || (cache.days[date] = {});
  day[tab.name] = { v: tab.values.map(r => r.slice()), dirty: nextRev() }; // a copy, so the snapshot above sees the old values
  saveCache();
  renderTabs(); updateStatus();
  scheduleSync(delay);
  noteProgress(date, tab.name, before, delay <= 300);
}

let syncTimer = null;
function scheduleSync(delay) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => sync(), delay);
}

const net = { busy: null, again: false, ok: null, error: '' };

/**
 * Sends every unsent edit and refreshes config + days in one call.
 * Default range: the last month. Unsent local edits always win over server data.
 */
async function sync(range) {
  if (!state.token) return;
  if (net.busy) { net.again = true; return net.busy; }
  clearTimeout(syncTimer);
  const today = todayISO();
  const from = range ? range.from : shiftISO(today, -KEEP_DAYS);
  const to = range ? range.to : shiftISO(today, 1);
  const pending = dirtyList().map(d => ({ id: d.date + '|' + d.tab, date: d.date, tab: d.tab, values: d.rec.v, rev: d.rec.dirty }));

  net.busy = (async () => {
    try {
      const res = await call('sync', {
        token: state.token, from, to, phrasesHash: cache.phrasesHash,
        changes: pending.map(p => ({ id: p.id, date: p.date, tab: p.tab, values: p.values })),
      });
      const viewBefore = JSON.stringify([cache.config, state.tabs.map(t => valuesFor(state.date, t))]);

      // Results of the sent edits. Edits made while the request was running keep their newer rev.
      res.results.forEach(r => {
        const p = pending.find(x => x.id === r.id);
        const rec = p && (cache.days[p.date] || {})[p.tab];
        if (!rec) return;
        if (r.ok) { if (rec.dirty === p.rev) { delete rec.dirty; delete rec.err; } }
        else rec.err = r.error;
      });

      cache.config = { startDate: res.startDate, pwaUrl: res.pwaUrl, tabs: res.tabs };
      store.set('pwaUrl', res.pwaUrl || null);

      // Server data replaces clean cached days in the synced range.
      for (let d = res.from; d <= res.to; d = shiftISO(d, 1)) {
        const server = res.days[d] || {};
        const day = cache.days[d] || {};
        new Set([...Object.keys(day), ...Object.keys(server)]).forEach(tab => {
          if (day[tab] && day[tab].dirty) return;
          if (server[tab]) day[tab] = { v: server[tab] }; else delete day[tab];
        });
        if (Object.keys(day).length) cache.days[d] = day; else delete cache.days[d];
      }
      if (res.daily) {
        // Streaks for [from - 1, to] (the day before `from` gives the first day its yesterday).
        const dd = res.daily.days || {};
        for (let d = shiftISO(res.from, -1); d <= res.to; d = shiftISO(d, 1)) {
          if (dd[d]) cache.daily[d] = dd[d]; else if (d >= res.from) delete cache.daily[d];
        }
        if (range) cache.bestFor[res.from] = res.daily.bestBefore || {};
        else { cache.best = res.daily.bestBefore || {}; cache.lastActive = res.daily.lastActive || ''; }
      }
      if (res.phrases) {
        cache.phrases = res.phrases; cache.phrasesHash = res.phrasesHash || '';
        store.set('phrases', JSON.stringify(cache.phrases)); store.set('phrasesHash', cache.phrasesHash);
      }
      if (range) { for (let d = res.from; d <= res.to; d = shiftISO(d, 1)) cache.known[d] = true; }
      else { cache.synced = { from: res.from, to: res.to }; prune(); }
      saveCache();
      net.ok = Date.now(); net.error = '';

      if (minDate() && state.date < minDate()) return setDate(minDate());
      updateDateLimits();
      // Re-render only when something visible changed, so typing isn't interrupted.
      const viewAfter = JSON.stringify([cache.config, cache.config.tabs.map(t => valuesFor(state.date, t))]);
      if (viewAfter !== viewBefore || !state.tabs.length) render(); else renderTabs();
    } catch (err) {
      if (isAuthError(err)) { showLogin('Please sign in again'); return; }
      net.error = errText(err);
      if (!cache.config || !dayKnown(state.date)) render();
    }
  })();
  updateStatus();
  await net.busy;
  net.busy = null;
  updateStatus();
  if ($('calDialog').open) renderCalendar();
  if (net.again) { net.again = false; sync(); }
  // A day outside the month window (e.g. picked while another sync was running).
  else if (!range && cache.config && !net.error && !dayKnown(state.date)) sync({ from: state.date, to: state.date });
}

function updateStatus() {
  const el = $('status');
  const unsent = dirtyList();
  const rejected = unsent.filter(d => d.rec.err);
  el.className = ''; el.title = ''; el.onclick = showSyncDialog;
  if (net.busy) { el.textContent = 'Syncing…'; return; }
  if (rejected.length) { el.className = 'err'; el.textContent = rejected.length + ' rejected'; el.title = rejected[0].rec.err; return; }
  if (unsent.length) {
    const days = new Set(unsent.map(d => d.date)).size;
    el.className = 'warn';
    el.textContent = (net.error ? 'Offline · ' : '') + days + ' unsent';
    el.title = days + (days === 1 ? ' day' : ' days') + ' not sent yet. Tap for details.';
    return;
  }
  if (net.error) { el.className = 'warn'; el.textContent = 'Offline'; el.title = net.error; return; }
  el.className = net.ok ? 'ok' : ''; el.textContent = net.ok ? 'Synced' : '';
}

function showSyncDialog() {
  const unsent = dirtyList();
  const fmt = d => d.split('-').reverse().join('.');
  let html = '';
  if (unsent.length) {
    html += '<p>Saved on this device, not sent to the spreadsheet yet:</p><ul class="unsent">' +
      unsent.map(d => '<li><b>' + fmt(d.date) + '</b> · ' + escapeHtml(d.tab) +
        (d.rec.err ? '<br><span class="error">' + escapeHtml(d.rec.err) + '</span>' : '') + '</li>').join('') + '</ul>';
  } else {
    html += '<p>Everything is sent.</p>';
  }
  if (net.error) html += '<p>Last sync failed: ' + escapeHtml(net.error) + '</p>';
  else if (net.ok) html += '<p>Last sync: ' + new Date(net.ok).toLocaleTimeString() + '</p>';
  html += '<button class="btn primary" id="syncNow" style="width:100%;margin-bottom:8px">Sync now</button>';
  $('syncBody').innerHTML = html;
  $('syncNow').onclick = () => { $('syncDialog').close(); sync(); };
  $('syncDialog').showModal();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- streaks, trophies, welcome back ----------
// Scope '' = the whole list, otherwise a tab name. Same rules as the Daily sheet (Code.js):
// a streak is yesterday's streak + 1 when the day is complete; a day is active when anything is marked.
const isFilled = v => v !== '' && v !== false && v !== null && v !== undefined;
const anyDirty = date => Object.values(cache.days[date] || {}).some(r => r.dirty);
const trackedTabs = () => (cache.config ? cache.config.tabs : []).filter(t => shownRows(t).length);

function scopeDone(date, scope) {
  const tabs = trackedTabs().filter(t => !scope || t.name === scope);
  return tabs.length > 0 && tabs.every(tab => {
    const v = valuesFor(date, tab);
    return shownRows(tab).every(i => rowComplete(tab, v[i]));
  });
}

function dayActive(date) {
  return (cache.config ? cache.config.tabs : []).some(tab => {
    const v = valuesFor(date, tab);
    return shownRows(tab).some(i => shownCols(tab).some(j => isFilled(v[i][j])));
  });
}

/** Streak stored on the server for a day, or null when there's no Daily row for it. */
function serverStreak(date, scope) {
  const d = cache.daily[date];
  return d ? Number(scope ? d.tabs[scope] : d.all) || 0 : null;
}

/** Streak of a day from the local data; yesterday comes from the server unless it has unsent edits. */
function streakAt(date, scope, depth = 0) {
  if (minDate() && date < minDate()) return 0;
  if (!dayKnown(date)) return serverStreak(date, scope) || 0;
  if (!scopeDone(date, scope)) return 0;
  const prev = shiftISO(date, -1);
  const s = serverStreak(prev, scope);
  if (s !== null && !anyDirty(prev)) return s + 1;
  return depth > 400 ? 1 : 1 + streakAt(prev, scope, depth + 1);
}

/** Best streak over the days before `date`, or Infinity if that isn't known on this device. */
function bestBefore(date, scope) {
  let from, best;
  const s = cache.synced;
  if (s && cache.best && date >= s.from) { from = s.from; best = cache.best[scope]; }
  else {
    from = Object.keys(cache.bestFor).filter(k => k <= date).sort().pop();
    if (!from) return Infinity;
    best = cache.bestFor[from][scope];
    for (let d = from; d < date; d = shiftISO(d, 1)) if (!dayKnown(d)) return Infinity;
  }
  best = Number(best) || 0;
  for (let d = from; d < date; d = shiftISO(d, 1)) best = Math.max(best, streakAt(d, scope));
  return best;
}

function lastActiveBefore(date) {
  let last = '';
  Object.keys(cache.days).forEach(d => { if (d < date && d > last && dayActive(d)) last = d; });
  if (!last && cache.synced && date >= cache.synced.from) last = cache.lastActive || '';
  return last;
}

function progressSnapshot(date, tabName) {
  if (!cache.config) return {};
  return { tab: scopeDone(date, tabName), all: scopeDone(date, ''), active: dayActive(date) };
}

// Completions noticed while typing; shown when the edit is finished.
const pendingCheer = {};

function noteProgress(date, tabName, before, final) {
  if (!cache.config) return;
  const after = progressSnapshot(date, tabName);
  const key = scope => date + '|' + scope;
  [[tabName, 'tab'], ['', 'all'], ['#back', 'active']].forEach(([scope, k]) => {
    if (!before[k] && after[k]) pendingCheer[key(scope)] = true;
    if (!after[k]) delete pendingCheer[key(scope)];
  });
  if (!final) return;
  const take = scope => { const p = pendingCheer[key(scope)]; delete pendingCheer[key(scope)]; return p; };
  if (take('#back')) welcomeBack(date);
  const tabCheer = take(tabName) && trophyFor(date, tabName);
  const allCheer = take('') && trophyFor(date, '');
  if (allCheer || tabCheer) queueCheer(allCheer || tabCheer);
}

/** A trophy when the streak beats the best before it, or every 10 days on the way there. */
function trophyFor(date, scope) {
  const ck = date + '|' + scope;
  if (cache.cheered[ck]) return null;
  const streak = streakAt(date, scope);
  if (!streak) return null;
  const best = bestBefore(date, scope);
  const record = streak > best;
  if (!record && streak % 10 !== 0) return null;
  cache.cheered[ck] = true; saveCache();
  return { kind: 'trophy', scope, streak, record, best };
}

/** First mark of today after at least one day without marks. */
function welcomeBack(date) {
  const ck = date + '|#back';
  if (date !== todayISO() || cache.cheered[ck]) return;
  const last = lastActiveBefore(date);
  if (!last || last >= shiftISO(date, -1)) return;
  cache.cheered[ck] = true; saveCache();
  queueCheer({ kind: 'back' });
}

const ukDays = n => {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? 'день' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'дні' : 'днів';
};

const FALLBACK_PHRASES = {
  win: ['Так тримати!', 'Чудова робота!', 'Ще один день — ще одна перемога.', 'Крок за кроком — і ось він, результат.'],
  back: ['З поверненням! Сподіваємося, відпочинок був добрим.', 'Раді тебе бачити! Головне — що ти тут.',
    'Кожен новий день — чиста сторінка. Почнімо!'],
};

/** Random phrase without repeats until the whole list has been shown (a shuffled "bag" per list). */
function phrase(kind) {
  const p = cache.phrases && cache.phrases[kind];
  const list = p && p.length ? p : FALLBACK_PHRASES[kind];
  const sig = (p && p.length ? cache.phrasesHash : 'fallback') + ':' + list.length;
  let bag = readJSON('bag.' + kind);
  if (!bag || bag.sig !== sig || !bag.left || !bag.left.length) {
    const left = list.map((_, i) => i);
    for (let i = left.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [left[i], left[j]] = [left[j], left[i]]; }
    bag = { sig, left };
  }
  const i = bag.left.pop();
  store.set('bag.' + kind, JSON.stringify(bag));
  return list[i] || list[0];
}

const TIERS = [ // [from streak, light, mid, dark]
  [100, '#e3f7ff', '#5cc8f0', '#2470a8'],
  [30, '#fff1a8', '#f5b417', '#a86d00'],
  [7, '#f7f9fb', '#b7c0ca', '#66727f'],
  [0, '#f6c79a', '#c47838', '#7a4019'],
];
const STAR = (x, y, r) => {
  const pts = [];
  for (let k = 0; k < 10; k++) {
    const a = Math.PI / 5 * k - Math.PI / 2, rr = k % 2 ? r * 0.45 : r;
    pts.push((x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
};

function trophySvg(streak, whole) {
  const [, c0, c1, c2] = TIERS.find(t => streak >= t[0]);
  const sparkles = whole ? [[14, 24, 7], [106, 20, 6], [100, 66, 5], [18, 70, 5], [60, 6, 5]].map(([x, y, r], k) =>
    '<polygon class="sparkle" style="animation-delay:' + (k * 0.25) + 's" points="' + STAR(x, y, r) + '" fill="' + c1 + '"/>').join('') : '';
  return '<svg viewBox="0 0 120 120" class="trophy" role="img" aria-label="Трофей">' +
    '<defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="' + c0 + '"/><stop offset=".55" stop-color="' + c1 +
    '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient>' +
    '<clipPath id="tcup"><path d="M31 20h58v24c0 18-12 31-29 31S31 62 31 44z"/></clipPath></defs>' +
    sparkles +
    '<path d="M33 30H21a5 5 0 0 0-5 5c0 15 10 25 23 27M87 30h12a5 5 0 0 1 5 5c0 15-10 25-23 27" fill="none" stroke="url(#tg)" stroke-width="6" stroke-linecap="round"/>' +
    '<path d="M31 20h58v24c0 18-12 31-29 31S31 62 31 44z" fill="url(#tg)"/>' +
    '<path d="M54 74h12l2 14H52z" fill="' + c2 + '"/>' +
    '<rect x="40" y="87" width="40" height="8" rx="2" fill="url(#tg)"/>' +
    '<rect x="33" y="95" width="54" height="12" rx="3" fill="' + c2 + '"/>' +
    '<path d="M41 27v16c0 10 4 17 10 21" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>' +
    '<polygon points="' + STAR(60, 43, whole ? 12 : 9) + '" fill="#fff" fill-opacity=".9"/>' +
    '<g clip-path="url(#tcup)"><rect class="shine" x="20" y="10" width="14" height="100" fill="#fff" fill-opacity=".4"/></g>' +
    '</svg>';
}

const SUNRISE_SVG = '<svg viewBox="0 0 120 120" class="sunrise" role="img" aria-label="Світанок">' +
  '<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76e"/><stop offset="1" stop-color="#ff9b5c"/></linearGradient>' +
  '<clipPath id="hz"><rect width="120" height="80"/></clipPath></defs>' +
  '<g clip-path="url(#hz)"><g class="sun">' +
  '<g class="rays" stroke="#ffc35c" stroke-width="3" stroke-linecap="round">' +
  Array.from({ length: 12 }, (_, k) => {
    const a = Math.PI / 6 * k, x1 = 60 + 30 * Math.cos(a), y1 = 80 + 30 * Math.sin(a), x2 = 60 + 40 * Math.cos(a), y2 = 80 + 40 * Math.sin(a);
    return '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
  }).join('') + '</g><circle cx="60" cy="80" r="24" fill="url(#sg)"/></g></g>' +
  '<path class="cloud" d="M14 46a7 7 0 0 1 12-5 9 9 0 0 1 16 4 6 6 0 0 1 0 11H17a5 5 0 0 1-3-10z" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>' +
  '<path d="M6 80h108" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>' +
  '<g class="sprout"><path d="M60 106V88" stroke="#3fa55f" stroke-width="3" stroke-linecap="round"/>' +
  '<path d="M60 94c-10 0-15-6-15-12 8 0 15 4 15 12zM60 90c0-9 6-14 14-14 0 9-6 14-14 14z" fill="#4cbb6c"/></g>' +
  '</svg>';

const cheerQueue = [];
function queueCheer(c) {
  cheerQueue.push(c);
  if (!$('cheer').open) showNextCheer();
}

function showNextCheer() {
  const c = cheerQueue.shift();
  if (!c) return;
  const dlg = $('cheer');
  dlg.className = 'cheer ' + c.kind;
  if (c.kind === 'back') {
    $('cheerArt').innerHTML = SUNRISE_SVG;
    $('cheerRibbon').textContent = '';
    $('cheerTitle').textContent = 'З поверненням!';
    $('cheerCount').innerHTML = '';
    $('cheerSub').textContent = '';
    $('cheerText').textContent = phrase('back');
    $('cheerOk').textContent = 'Почнімо';
  } else {
    const whole = !c.scope;
    $('cheerArt').innerHTML = trophySvg(c.streak, whole);
    $('cheerRibbon').textContent = c.record ? 'Новий рекорд!' : 'Ще десяток!';
    $('cheerTitle').textContent = whole ? 'Увесь список виконано' : c.scope;
    $('cheerCount').innerHTML = '<b>' + c.streak + '</b><span>' + ukDays(c.streak) + ' поспіль</span>';
    $('cheerSub').textContent = c.record || !isFinite(c.best) ? '' : 'Рекорд: ' + c.best + ' ' + ukDays(c.best);
    $('cheerText').textContent = phrase('win');
    $('cheerOk').textContent = 'Дякую!';
    try { navigator.vibrate && navigator.vibrate([30, 60, 30]); } catch (e) {}
  }
  dlg.classList.toggle('whole', c.kind === 'trophy' && !c.scope);
  burst(c.kind);
  dlg.showModal();
}

/** Confetti for trophies, slow floating lights for welcome back. */
function burst(kind) {
  const fx = $('cheerFx');
  fx.innerHTML = '';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = kind === 'back' ? ['#ffd76e', '#ffb37a', '#9fd8a8', '#a9c8ff'] : ['#f5b417', '#2f6fde', '#1f9d55', '#e8506a', '#9b5de5', '#ff8c42'];
  const n = kind === 'back' ? 18 : 70;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    const r = Math.random;
    p.style.cssText = '--x:' + (r() * 100).toFixed(1) + 'vw;--dx:' + ((r() - 0.5) * 30).toFixed(1) + 'vw;--rot:' + Math.round(r() * 720 - 360) +
      'deg;--d:' + (kind === 'back' ? 5 + r() * 4 : 2.2 + r() * 1.8).toFixed(2) + 's;--delay:' + (r() * (kind === 'back' ? 2 : 0.6)).toFixed(2) +
      's;background:' + colors[i % colors.length] + (kind === 'back' ? '' : ';width:' + (6 + r() * 6).toFixed(0) + 'px;height:' + (8 + r() * 8).toFixed(0) + 'px');
    fx.appendChild(p);
  }
}

$('cheer').addEventListener('close', () => { $('cheerFx').innerHTML = ''; setTimeout(showNextCheer, 250); });
$('cheer').addEventListener('click', e => { if (e.target === $('cheer')) $('cheer').close(); });

// ---------- month calendar ----------
const cal = { month: '', tab: store.get('calTab') || '', tried: '' }; // month = 'yyyy-MM', tab '' = all tabs

/**
 * Progress of one day, 0..1, or null if the day has nothing to track.
 * A row counts as done when all its checkboxes are ticked; rows without checkboxes count when filled in.
 */
function dayProgress(date) {
  if (!cache.config) return null;
  let done = 0, total = 0;
  cache.config.tabs.filter(t => !cal.tab || t.name === cal.tab).forEach(tab => {
    const values = valuesFor(date, tab);
    shownRows(tab).forEach(i => {
      total++;
      if (rowComplete(tab, values[i])) done++;
    });
  });
  return total ? done / total : null;
}

function monthDays(month) {
  const [y, m] = month.split('-').map(Number);
  const n = new Date(y, m, 0).getDate();
  return Array.from({ length: n }, (_, i) => month + '-' + pad(i + 1));
}

function openCalendar() {
  cal.month = state.date.slice(0, 7);
  cal.tried = '';
  renderCalendar();
  $('calDialog').showModal();
}

function shiftMonth(delta) {
  const [y, m] = cal.month.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  cal.month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
  renderCalendar();
}

function renderCalendar() {
  const days = monthDays(cal.month);
  const first = days[0], last = days[days.length - 1];
  const today = todayISO();
  const [y, m] = cal.month.split('-').map(Number);
  $('calTitle').textContent = new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  $('calPrev').disabled = !!minDate() && first <= minDate();

  // Tab filter chips.
  const tabs = cache.config ? cache.config.tabs : [];
  if (cal.tab && !tabs.some(t => t.name === cal.tab)) cal.tab = '';
  $('calTabs').innerHTML = '';
  [''].concat(tabs.map(t => t.name)).forEach(name => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = name || 'All';
    b.className = cal.tab === name ? 'active' : '';
    b.onclick = () => { cal.tab = name; store.set('calTab', name || null); renderCalendar(); };
    $('calTabs').appendChild(b);
  });
  $('calTabs').classList.toggle('hidden', tabs.length < 2);

  // Weekday headers, Monday first, in the browser's language.
  const grid = $('calGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const el = document.createElement('div');
    el.className = 'wd';
    el.textContent = new Date(2024, 0, 1 + i).toLocaleDateString(undefined, { weekday: 'short' }); // 2024-01-01 is a Monday
    grid.appendChild(el);
  }
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('div'));

  const R = 15.5, C = 2 * Math.PI * R;
  let missing = false, full = 0, tracked = 0;
  days.forEach(date => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cal-day';
    const before = minDate() && date < minDate();
    const future = date > today;
    const known = dayKnown(date);
    if (!known && !before && !future) missing = true;
    const p = before || future || !known ? null : dayProgress(date);
    if (p !== null) { tracked++; if (p >= 1) full++; }
    if (p !== null && p >= 1) b.classList.add('full');
    if (!known && !future && !before) b.classList.add('unknown');
    if (date === today) b.classList.add('today');
    if (date === state.date) b.classList.add('selected');
    b.disabled = !!before;
    if (future) b.classList.add('future');
    const arc = p > 0 ? '<circle class="arc" cx="18" cy="18" r="' + R + '" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="' +
      (p * C).toFixed(2) + ' ' + C.toFixed(2) + '"/>' : '';
    b.innerHTML = '<svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="' + R + '" fill="none" stroke-width="3"/>' + arc + '</svg>' +
      '<span>' + Number(date.slice(8)) + '</span>';
    const unsent = Object.values(cache.days[date] || {}).some(r => r.dirty && (!cal.tab || r === cache.days[date][cal.tab]));
    if (unsent) { const dot = document.createElement('i'); dot.className = 'unsent-dot'; dot.title = 'Not sent yet'; b.appendChild(dot); }
    b.title = date.split('-').reverse().join('.') + (p !== null ? ' · ' + Math.round(p * 100) + '%' : '');
    b.onclick = () => { $('calDialog').close(); setDate(date); };
    grid.appendChild(b);
  });

  $('calSummary').textContent = tracked ? 'Completed: ' + full + ' of ' + tracked + ' days' : '';
  // Load days of this month that aren't on the device yet (older months).
  if (missing && !net.busy && state.token && cal.tried !== cal.month) {
    cal.tried = cal.month; // once per month while the calendar is open (no retry loop when offline)
    const from = minDate() && first < minDate() ? minDate() : first;
    sync({ from, to: last < today ? last : today });
  }
}

$('calendar').onclick = openCalendar;
$('calPrev').onclick = () => shiftMonth(-1);
$('calNext').onclick = () => shiftMonth(1);

// ---------- PWA / install ----------
if (API_URL && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const inAppsScript = !!(window.google && google.script && google.script.run);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installPrompt = null;

if (isStandalone()) document.body.classList.add('installed');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; document.body.classList.add('installed'); });

const SHARE_ICON = '<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const PLUS_ICON = '<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="Add"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';

function showInstallHelp(html) {
  $('installBody').innerHTML = html;
  $('installDialog').showModal();
}

async function install() {
  // Google's page can't be installed (no manifest/service worker there): send to the PWA copy.
  // Without a PWA copy (script property PWA_URL), a home screen shortcut to this page is the way.
  if (inAppsScript) {
    const url = store.get('pwaUrl');
    if (url) { window.open(url, '_blank'); return; }
    if (!isIOS) {
      return showInstallHelp('<p><b>Android (Chrome):</b></p><ol>' +
        '<li>Tap the menu <b>⋮</b> (top right).</li>' +
        '<li>Tap <b>Add to Home screen</b>, then <b>Add</b>.</li></ol>' +
        '<p><b>Computer (Chrome / Edge):</b></p><ol>' +
        '<li>Open the menu <b>⋮</b> / <b>⋯</b>.</li>' +
        '<li>Chrome: <b>Cast, save and share → Create shortcut</b> (tick "Open as window"). ' +
        'Edge: <b>Apps → Install this site as an app</b>.</li></ol>');
    }
  }
  if (installPrompt) {
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    if (outcome === 'accepted') installPrompt = null;
    return;
  }
  if (isIOS) {
    return showInstallHelp('<ol>' +
      '<li>Open this page in <b>Safari</b>.</li>' +
      '<li>Tap <b>Share</b> ' + SHARE_ICON + ' (bottom bar on iPhone, top on iPad; in Chrome it\'s in the address bar).</li>' +
      '<li>Scroll down and tap <b>Add to Home Screen</b> ' + PLUS_ICON + '.</li>' +
      '<li>Tap <b>Add</b>. Tracker appears on your home screen.</li></ol>');
  }
  if (!window.isSecureContext) {
    return showInstallHelp('<p>Browsers only install apps opened over <b>https://</b>. Open the app from its https address to install it.</p>');
  }
  showInstallHelp('<ol>' +
    '<li>Open the browser menu (⋮ or ⋯).</li>' +
    '<li>Choose <b>Install app</b>, <b>Add to Home screen</b> or <b>Apps → Install this site as an app</b>.</li></ol>' +
    '<p>If the option isn\'t there yet, reload the page once and try again.</p>');
}

document.querySelectorAll('.install').forEach(b => b.addEventListener('click', install));

// ---------- start ----------
state.token ? showApp() : showLogin();
</script>

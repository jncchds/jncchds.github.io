<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гардероб</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8a4fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f5f3f0; --card: #ffffff; --text: #1f1d1a; --muted: #77716a; --line: #e4dfd8;
    --accent: #8a4fd8; --accent-text: #ffffff; --accent-soft: #efe6fb;
    --ok: #1f9d55; --err: #d64545; --fav: #e0a100;
    --c0: #6f8fd8; --c1: #d8806f; --c2: #5fae8c; --c3: #c69a3c; --c4: #a07bd6; --c5: #d06fa8; --c6: #5aa9b8; --c7: #8b8f6a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141316; --card: #1e1d22; --text: #ece9f1; --muted: #9a95a3; --line: #2e2c34;
      --accent: #a87ef0; --accent-text: #120e18; --accent-soft: #2a2236;
      --ok: #3fbf74; --err: #ef6b6b; --fav: #f0bb2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  :focus:not(:focus-visible) { outline: none; }
  .muted { color: var(--muted); }
  h2 { font-size: 18px; margin: 20px 0 10px; }
  h2:first-child { margin-top: 4px; }

  .field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .btn { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn.danger { color: var(--err); }
  .btn.small { padding: 6px 10px; font-size: 14px; border-radius: 8px; }
  .btn.on { background: var(--accent-soft); border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.wide { width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .error { color: var(--err); font-size: 14px; min-height: 1.2em; }
  .link { border: 0; background: none; color: var(--accent); padding: 4px; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  #login form { width: 100%; max-width: 320px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; display: grid; gap: 12px; }
  #login h1 { margin: 0; font-size: 22px; }

  /* app shell */
  header { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 720px; margin: 0 auto; padding: 8px 12px; display: flex; gap: 6px; align-items: center; min-height: 52px; }
  .bar h1 { font-size: 18px; margin: 0 4px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; flex: none; border: 0; background: none; font-size: 22px; border-radius: 10px; }
  #status { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #status.err { color: var(--err); }
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(84px + env(safe-area-inset-bottom)); }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  #tabs button { flex: 1; border: 0; background: none; padding: 8px 0 10px; display: grid; justify-items: center; gap: 2px;
    color: var(--muted); font-size: 12px; }
  #tabs button svg { width: 24px; height: 24px; }
  #tabs button.active { color: var(--accent); font-weight: 600; }

  /* pictures */
  .pic { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--line); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic img.broken { visibility: hidden; }
  .pic.ph { background: color-mix(in srgb, var(--c) 22%, var(--card)); border: 2px dashed color-mix(in srgb, var(--c) 60%, transparent);
    display: grid; place-content: center; text-align: center; padding: 6px; gap: 2px; }
  .ph-name { font-weight: 600; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ph-note { font-size: 11px; color: var(--muted); }
  .pic.deleted { opacity: .35; filter: grayscale(1); }
  .pic.deleted::after { content: 'видалено'; position: absolute; inset: auto 0 6px; text-align: center; font-size: 11px; font-weight: 600; color: var(--err); }
  .pic.empty { background: transparent; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 26px; }
  .pic .tag { position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--card); }
  .small-pics .ph-name { font-size: 10px; } .small-pics .ph-note { display: none; } .small-pics .pic { border-radius: 8px; }

  /* look (one outfit, big) */
  .look { display: grid; grid-template-columns: 1.35fr 1fr; gap: 8px; }
  .look > * { min-width: 0; }
  .look > :first-child { grid-row: span var(--rest); }
  .look > :first-child, .look > :first-child > .pic { aspect-ratio: auto; height: 100%; }
  .look:not(.single) > :first-child .ph-name { font-size: 18px; }
  .look.single { grid-template-columns: 1fr; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .card + .card { margin-top: 12px; }
  .card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-title b { font-size: 17px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 auto; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .badge.fav { background: color-mix(in srgb, var(--fav) 18%, transparent); color: var(--fav); }

  /* grid board */
  .board { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
  .board .cell { position: relative; border: 0; padding: 0; background: none; border-radius: 12px; transition: transform .12s; }
  .board .cell .pic { border-radius: 12px; }
  .board .cell.sel { outline: 3px solid var(--accent); outline-offset: 2px; transform: scale(.96); }
  .board .cell.hl::before { content: ''; position: absolute; inset: -3px; border-radius: 14px; border: 3px solid var(--fav); z-index: 1; pointer-events: none; }
  .board.dim .cell:not(.hl) { opacity: .45; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 2px 0; min-height: 1.4em; }
  .toolbar { display: flex; gap: 8px; margin-top: 10px; }
  .toolbar .btn { flex: 1; }

  /* outfit list in a grid */
  .outfit { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 10px; }
  .outfit .mini { display: grid; grid-template-columns: repeat(var(--n), 56px); gap: 4px; cursor: pointer; }
  .outfit .meta { display: grid; gap: 4px; justify-items: end; font-size: 12px; color: var(--muted); text-align: right; }
  .outfit .actions { grid-column: 1 / -1; margin-top: 0; }
  .outfit.hl { border-color: var(--fav); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fav) 50%, transparent); }
  .ico-btn { flex: 1; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .ico-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .ico-btn.fav.on { background: color-mix(in srgb, var(--fav) 15%, transparent); border-color: var(--fav); color: var(--fav); }

  /* lists */
  .grid-list { display: grid; gap: 12px; }
  .grid-card { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; }
  .grid-card .board { gap: 2px; }
  .grid-card .board .pic { border-radius: 4px; border-width: 1px; }
  .grid-card .board .pic .ph-name, .grid-card .board .pic .ph-note { display: none; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; white-space: nowrap; font-size: 14px; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 4px; }
  .tile .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.in-grid .pic { outline: 3px solid var(--accent); outline-offset: -3px; }
  .tile:disabled { opacity: .35; }
  .list { display: grid; gap: 8px; }
  .list-row { display: flex; gap: 8px; align-items: center; }
  .list-row .field { flex: 1; min-width: 0; }
  .empty-state { text-align: center; padding: 40px 12px; color: var(--muted); display: grid; gap: 14px; justify-items: center; }
  .empty-state .big { font-size: 46px; }
  .settings { display: grid; gap: 8px; margin-top: 24px; }
  .settings .btn { text-align: left; display: flex; justify-content: space-between; }
  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .results button { border: 0; padding: 0; background: none; }

  /* dialog */
  dialog { border: 0; padding: 0; width: min(560px, 100vw); max-width: 100vw; max-height: 92vh; margin: auto auto 0; border-radius: 20px 20px 0 0;
    background: var(--card); color: var(--text); }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 20px; } }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  .dlg-head { position: sticky; top: 0; background: var(--card); display: flex; align-items: center; padding: 10px 8px 6px 18px; z-index: 1; }
  .dlg-head h3 { margin: 0; flex: 1; font-size: 18px; }
  .dlg-body { padding: 4px 18px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
  .dlg-body label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  .dlg-body label > .field { color: var(--text); }
  #viewer { background: #000; width: 100vw; height: 100vh; max-height: 100vh; margin: 0; border-radius: 0; }
  #viewer img { width: 100%; height: 100%; object-fit: contain; }
  #viewer button { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; color: #fff; background: rgba(0,0,0,.4); }
  .item-photo { max-width: 260px; width: 100%; justify-self: center; }

  #toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 12px; align-items: center;
    width: max-content; max-width: calc(100vw - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #toast.err { background: var(--err); color: #fff; }
  #toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form id="loginForm">
    <h1>👗 Гардероб</h1>
    <div class="muted">Введіть пароль, щоб увійти.</div>
    <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <button class="btn primary" type="submit">Увійти</button>
    <div id="loginError" class="error"></div>
    <button type="button" class="link install">Встановити застосунок</button>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="bar">
      <button id="back" class="icon hidden" aria-label="Назад">‹</button>
      <h1 id="title">Гардероб</h1>
      <span id="status"></span>
      <button id="menuBtn" class="icon" aria-label="Меню">⋯</button>
    </div>
  </header>
  <main id="content"></main>
  <nav id="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сьогодні</button>
    <button data-tab="grids"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>Сітки</button>
    <button data-tab="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6a2 2 0 1 1 2-2M12 6v2L3 15a1.5 1.5 0 0 0 1 2.6h16a1.5 1.5 0 0 0 1-2.6l-9-7"/></svg>Речі</button>
  </nav>
</section>

<dialog id="dlg"><div class="dlg-head"><h3 id="dlgTitle"></h3><button class="icon" id="dlgClose" aria-label="Закрити">✕</button></div><div class="dlg-body" id="dlgBody"></div></dialog>
<dialog id="viewer"><img id="viewerImg" alt=""><button class="icon" id="viewerClose" aria-label="Закрити">✕</button></dialog>
<div id="toast" class="hidden"></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdV3DiwOnQyS0CcvO77OHNZMmtjWVQpY1CMG0dpSvqJk-WPCAv27GWqxZcOcmt79Rx/exec"; // set by scripts/build-pwa.mjs for the standalone PWA

// ---------- storage / transport ----------
const store = {
  get(k) { try { return localStorage.getItem('clothing.' + k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('clothing.' + k) : localStorage.setItem('clothing.' + k, v); } catch (e) {} },
};

function call(fn, args) {
  if (window.__mockCall) return window.__mockCall(fn, args); // scripts/preview.mjs
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).rpc(fn, args));
  }
  if (!API_URL) return Promise.reject(new Error('API_URL is not configured'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request: no CORS preflight
    body: JSON.stringify({ fn, args }),
  }).then(r => r.json()).then(r => r.ok ? r.result : Promise.reject(new Error(r.error)));
}

const errText = e => {
  const s = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
  return /Failed to fetch|NetworkError|Load failed|network/i.test(s) ? 'Немає з\'єднання' : s;
};
const isAuthError = e => errText(e).includes('AUTH_REQUIRED');

// ---------- small helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
function shiftISO(s, days) { const [y, m, d] = s.split('-').map(Number); return iso(new Date(y, m - 1, d + days)); }
function daysAgo(date) {
  const [y, m, d] = date.split('-').map(Number);
  const n = Math.round((new Date(new Date().toDateString()) - new Date(y, m - 1, d)) / 864e5);
  if (n <= 0) return 'сьогодні';
  if (n === 1) return 'вчора';
  return n + ' ' + plural(n, 'день', 'дні', 'днів') + ' тому';
}
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// ---------- data ----------
// data: { categories, items, grids, outfits, worn, pwaUrl } as returned by `load`, cached on the device.
const readJSON = k => { try { return JSON.parse(store.get(k) || 'null'); } catch (e) { return null; } };
let data = readJSON('data') || { categories: [], items: [], grids: [], outfits: [], worn: [] };
const state = { token: store.get('token'), tab: store.get('tab') || 'today', gridId: null, sel: -1, hl: '', catFilter: '', showDeleted: false,
  suggest: 0, busy: 0, offline: false };
const previews = {}; // fileId -> data URL of a photo uploaded in this session (Drive thumbnails take a moment)

function saveData() { store.set('data', JSON.stringify(data)); }
const byId = (list, id) => list.find(x => x.id === id);
const liveCats = () => data.categories.filter(c => !c.deleted).sort((a, b) => a.order - b.order);
const catColor = id => {
  const i = data.categories.slice().sort((a, b) => a.order - b.order).findIndex(c => c.id === id);
  return 'var(--c' + ((i < 0 ? 0 : i) % 8) + ')';
};
const catName = id => (byId(data.categories, id) || {}).name || '';
const liveGrids = () => data.grids.filter(g => !g.deleted);
const outfitRec = key => data.outfits.find(o => o.key === key) || { key, status: '', resultFileIds: [] };
const outfitKey = ids => ids.slice().sort().join('+');
function lastWorn(key) {
  let last = '';
  for (const w of data.worn) if (w.outfitKey === key && w.date > last) last = w.date;
  return last;
}
const wornToday = key => data.worn.some(w => w.outfitKey === key && w.date === todayISO());
function upsertLocal(list, keyField, obj) {
  const i = data[list].findIndex(x => x[keyField] === obj[keyField]);
  if (i >= 0) data[list][i] = Object.assign({}, data[list][i], obj); else data[list].push(obj);
  saveData();
}

// ---------- pictures ----------
function thumbUrl(fileId, w) {
  if (previews[fileId]) return previews[fileId];
  if (window.__thumb) return window.__thumb(fileId, w);
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fileId) + '&sz=w' + w;
}
function itemPic(item, w) {
  if (!item) return '<div class="pic empty">+</div>';
  const cls = item.deleted ? ' deleted' : '';
  const style = ' style="--c:' + catColor(item.categoryId) + '"';
  if (item.fileId) {
    return '<div class="pic' + cls + '"' + style + '><img loading="lazy" alt="' + esc(item.name) + '" src="' + esc(thumbUrl(item.fileId, w || 400)) +
      '" onerror="this.classList.add(\'broken\')"><i class="tag"></i></div>';
  }
  return '<div class="pic ph' + cls + '"' + style + '><span class="ph-name">' + esc(item.name || catName(item.categoryId)) +
    '</span><span class="ph-note">фото згодом</span></div>';
}
function openViewer(fileId) {
  $('viewerImg').src = thumbUrl(fileId, 1600);
  $('viewer').showModal();
}
$('viewerClose').onclick = () => $('viewer').close();
$('viewer').onclick = e => { if (e.target.id === 'viewer' || e.target.id === 'viewerImg') $('viewer').close(); };

/** Asks for a photo (camera or gallery), returns { data (base64 JPEG), type, url } or null. */
function pickPhoto() {
  return new Promise(resolve => {
    const inp = $('fileInput');
    inp.value = '';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      if (!f) return resolve(null);
      try { resolve(await resizePhoto(f, 1600)); } catch (e) { toast('Не вдалося відкрити фото', true); resolve(null); }
    };
    inp.click();
  });
}
function resizePhoto(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.85);
      resolve({ data: dataUrl.split(',')[1], type: 'image/jpeg', url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

// ---------- grid logic ----------
/** All lines of an n×n grid: rows, columns and wrap-around diagonals in both directions (cell indexes). */
function gridLines(n) {
  const seq = f => Array.from({ length: n }, (_, i) => f(i));
  const lines = [];
  for (let r = 0; r < n; r++) lines.push({ label: 'Рядок ' + (r + 1), cells: seq(c => r * n + c) });
  for (let c = 0; c < n; c++) lines.push({ label: 'Стовпчик ' + (c + 1), cells: seq(r => r * n + c) });
  for (let d = 0; d < n; d++) lines.push({ label: 'Діагональ ↘' + (d ? ' ' + (d + 1) : ''), cells: seq(r => r * n + (r + d) % n) });
  for (let d = 0; d < n; d++) lines.push({ label: 'Діагональ ↙' + (d ? ' ' + (d + 1) : ''), cells: seq(r => r * n + (n - 1 - r + n - d) % n) });
  return lines;
}

/** Outfits of a grid: lines holding exactly one live item of each grid category. Items are ordered by category. */
function gridOutfits(g) {
  const n = g.categoryIds.length, seen = {}, out = [];
  for (const line of gridLines(n)) {
    const items = line.cells.map(i => byId(data.items, g.cells[i]));
    if (items.some(it => !it || it.deleted)) continue;
    const cats = new Set(items.map(it => it.categoryId));
    if (cats.size !== n || !g.categoryIds.every(c => cats.has(c))) continue;
    items.sort((a, b) => g.categoryIds.indexOf(a.categoryId) - g.categoryIds.indexOf(b.categoryId));
    const key = outfitKey(items.map(it => it.id));
    if (seen[key]) continue;
    seen[key] = true;
    const rec = outfitRec(key);
    out.push({ key, items, line, grid: g, status: rec.status, results: rec.resultFileIds || [], last: lastWorn(key) });
  }
  return out;
}

/** Sudoku-style fill: category k goes where (r + c + 1) mod n == k, so the first category is on the ↙ diagonal. */
function fillGrid(categoryIds, picked) {
  const n = categoryIds.length, cells = Array(n * n).fill('');
  categoryIds.forEach((cid, k) => {
    let j = 0;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if ((r + c + 1) % n === k) cells[r * n + c] = (picked[cid] || [])[j++] || '';
    }
  });
  return cells;
}

/** n random live items per category: { categoryId: [itemId, ...] }. */
function randomPick(categoryIds, n) {
  const picked = {};
  categoryIds.forEach(cid => {
    const ids = data.items.filter(i => i.categoryId === cid && !i.deleted).map(i => i.id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    picked[cid] = ids.slice(0, n);
  });
  return picked;
}

function allOutfits() {
  const map = new Map();
  for (const g of liveGrids()) for (const o of gridOutfits(g)) if (!map.has(o.key)) map.set(o.key, o);
  return [...map.values()];
}

/** Today's order: not worn in the last week first, favourites first, then longest unworn; a fixed shuffle per day. */
function suggestions() {
  const today = todayISO(), weekAgo = shiftISO(today, -7);
  return allOutfits().filter(o => o.status !== 'rejected').map(o => ({ o,
    k: [o.last >= weekAgo ? 1 : 0, o.status === 'favourite' ? 0 : 1, o.last || '', hash(today + o.key)] }))
    .sort((a, b) => { for (let i = 0; i < 4; i++) if (a.k[i] !== b.k[i]) return a.k[i] < b.k[i] ? -1 : 1; return 0; })
    .map(x => x.o);
}

// ---------- server calls ----------
function setStatus() {
  const s = $('status');
  s.className = state.offline ? 'err' : '';
  s.innerHTML = state.busy ? '<span class="spinner"></span>' : state.offline ? 'офлайн' : '';
}

async function api(fn, args, okMsg) {
  state.busy++; setStatus();
  try {
    const res = await call(fn, Object.assign({ token: state.token }, args));
    state.offline = false;
    if (okMsg) toast(okMsg);
    return res;
  } catch (e) {
    if (isAuthError(e)) { logout(); throw e; }
    if (errText(e) === 'Немає з\'єднання') state.offline = true;
    toast(errText(e), true);
    throw e;
  } finally { state.busy--; setStatus(); }
}

let lastLoad = 0;
async function load() {
  lastLoad = Date.now();
  state.busy++; setStatus();
  try {
    const res = await call('load', { token: state.token });
    data = { categories: res.categories, items: res.items, grids: res.grids, outfits: res.outfits, worn: res.worn };
    saveData();
    if (res.pwaUrl != null) store.set('pwaUrl', res.pwaUrl || null);
    state.offline = false;
    render();
  } catch (e) {
    if (isAuthError(e)) return logout();
    state.offline = true;
    if (!data.categories.length) $('content').innerHTML = '<div class="empty-state"><div class="big">📡</div><div>Не вдалося завантажити дані: ' +
      esc(errText(e)) + '</div><button class="btn" onclick="load()">Спробувати ще</button></div>';
  } finally { state.busy--; setStatus(); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token && Date.now() - lastLoad > 60000) load();
});

// ---------- toast / dialog ----------
let toastTimer = 0;
function toast(msg, isErr, undo) {
  const t = $('toast');
  t.className = isErr ? 'err' : '';
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button>Скасувати</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { t.classList.add('hidden'); undo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), undo ? 6000 : isErr ? 5000 : 2500);
}
function openDialog(title, html) {
  $('dlgTitle').textContent = title;
  $('dlgBody').innerHTML = html;
  if (!$('dlg').open) { $('dlg').showModal(); if (document.activeElement) document.activeElement.blur(); }
  return $('dlgBody');
}
const closeDialog = () => $('dlg').open && $('dlg').close();
$('dlgClose').onclick = closeDialog;
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) closeDialog(); });

// ---------- shell ----------
function showLogin() {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('password').focus();
}
function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  render();
  load();
}
function logout() {
  state.token = null;
  store.set('token', null);
  store.set('data', null);
  data = { categories: [], items: [], grids: [], outfits: [], worn: [] };
  closeDialog();
  showLogin();
}
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled = true;
  try {
    const res = await call('login', { password: $('password').value });
    state.token = res.token;
    store.set('token', res.token);
    if (res.pwaUrl) store.set('pwaUrl', res.pwaUrl);
    $('password').value = '';
    showApp();
  } catch (err) {
    $('loginError').textContent = errText(err);
  } finally { btn.disabled = false; }
};

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  if (state.tab === b.dataset.tab && state.tab === 'grids') state.gridId = null; // second tap: back to the list
  state.tab = b.dataset.tab;
  store.set('tab', state.tab);
  state.sel = -1; state.hl = '';
  render();
  window.scrollTo(0, 0);
});
$('back').onclick = () => { state.gridId = null; state.sel = -1; state.hl = ''; render(); };
$('menuBtn').onclick = () => {
  const body = openDialog('Меню', '<button class="btn wide" id="mReload">Оновити дані</button>' +
    '<button class="btn wide install">Встановити застосунок</button>' +
    '<button class="btn wide danger" id="mLogout">Вийти</button>');
  body.querySelector('#mReload').onclick = () => { closeDialog(); load(); };
  body.querySelector('.install').onclick = () => { closeDialog(); install(); };
  body.querySelector('#mLogout').onclick = logout;
};

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const g = state.tab === 'grids' && state.gridId ? byId(data.grids, state.gridId) : null;
  if (state.tab === 'grids' && state.gridId && !g) state.gridId = null;
  $('back').classList.toggle('hidden', !g);
  $('title').textContent = g ? (g.name || 'Сітка') : { today: 'Сьогодні', grids: 'Сітки', items: 'Речі' }[state.tab];
  const main = $('content');
  if (state.tab === 'today') main.innerHTML = renderToday();
  else if (state.tab === 'grids') main.innerHTML = g ? renderGrid(g) : renderGridList();
  else main.innerHTML = renderItems();
  bind(main);
  setStatus();
}

/** Click handling for rendered markup: elements carry data-act="name" and data-* arguments. */
function bind(root) {
  root.querySelectorAll('[data-act]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el.dataset, el);
  });
}

// ---------- today ----------
function lookHtml(o) {
  const n = o.items.length;
  return '<div class="look' + (n < 2 ? ' single' : '') + '" style="--rest:' + Math.max(1, n - 1) + '">' +
    o.items.map(it => it.fileId ? '<div data-act="view" data-file="' + esc(it.fileId) + '">' + itemPic(it, 800) + '</div>' : itemPic(it, 800)).join('') + '</div>';
}
function outfitMeta(o) {
  const bits = [];
  if (o.status === 'favourite') bits.push('<span class="badge fav">★ улюблений</span>');
  bits.push('<span class="muted" style="font-size:13px">' + (o.last ? 'одягали ' + daysAgo(o.last) : 'ще не одягали') + '</span>');
  return bits.join(' ');
}
function renderToday() {
  if (!data.items.some(i => !i.deleted)) {
    return emptyState('🧥', 'Почніть з того, щоб додати речі: верхній одяг, верх, низ.', 'Додати речі', 'goItems');
  }
  if (!liveGrids().length) {
    return emptyState('▦', 'Створіть першу сітку: оберіть по кілька речей кожної категорії, і застосунок складе з них образи.', 'Створити сітку', 'newGrid');
  }
  const worn = allOutfits().filter(o => wornToday(o.key));
  let html = '';
  worn.forEach(o => {
    html += '<div class="card"><div class="card-title"><b>Сьогодні на вас</b><span class="muted" style="font-size:13px">' + esc(o.grid.name) + '</span></div>' +
      lookHtml(o) + '<div class="actions">' +
      '<button class="btn" data-act="result" data-key="' + o.key + '">📷 Фото образу</button>' +
      '<button class="btn" data-act="wear" data-key="' + o.key + '" data-grid="' + o.grid.id + '">Скасувати</button></div></div>';
  });
  const list = suggestions().filter(o => !wornToday(o.key));
  if (!list.length) {
    html += worn.length ? '' : emptyState('🤷', 'Усі образи відхилено. Змініть сітку або додайте нові речі.', 'До сіток', 'goGrids');
    return html;
  }
  const o = list[state.suggest % list.length];
  html += '<div class="card"><div class="card-title"><b>' + (worn.length ? 'Ще варіант' : 'Пропозиція на сьогодні') + '</b>' +
    '<span class="muted" style="font-size:13px">' + (state.suggest % list.length + 1) + ' з ' + list.length + '</span></div>' +
    lookHtml(o) +
    '<div class="row" style="margin-top:10px;justify-content:space-between">' + outfitMeta(o) +
    '<span class="muted" style="font-size:13px">' + esc(o.grid.name) + '</span></div>' +
    '<div class="actions">' +
    '<button class="btn primary" data-act="wear" data-key="' + o.key + '" data-grid="' + o.grid.id + '">Одягаю!</button>' +
    '<button class="btn" data-act="nextSuggest">Інший варіант ›</button></div>' +
    '<div class="actions">' +
    '<button class="ico-btn fav' + (o.status === 'favourite' ? ' on' : '') + '" data-act="fav" data-key="' + o.key + '">★ Улюблений</button>' +
    '<button class="ico-btn" data-act="result" data-key="' + o.key + '">📷 Фото</button>' +
    '<button class="ico-btn" data-act="reject" data-key="' + o.key + '">✕ Не пропонувати</button></div></div>';
  return html;
}
function emptyState(icon, text, btn, act) {
  return '<div class="empty-state"><div class="big">' + icon + '</div><div>' + esc(text) + '</div>' +
    (btn ? '<button class="btn primary" data-act="' + act + '">' + esc(btn) + '</button>' : '') + '</div>';
}

// ---------- grids ----------
function boardHtml(g, interactive) {
  const n = g.categoryIds.length;
  const hlCells = new Set();
  if (interactive && state.hl) {
    const o = gridOutfits(g).find(x => x.key === state.hl);
    if (o) o.line.cells.forEach(i => hlCells.add(i));
  }
  let html = '<div class="board' + (hlCells.size ? ' dim' : '') + '" style="--n:' + n + '">';
  for (let i = 0; i < n * n; i++) {
    const it = byId(data.items, g.cells[i]);
    const cls = 'cell' + (interactive && state.sel === i ? ' sel' : '') + (hlCells.has(i) ? ' hl' : '');
    html += interactive ? '<button class="' + cls + '" data-act="cell" data-i="' + i + '">' + itemPic(it, 400) + '</button>'
      : '<div class="cell">' + itemPic(it, 120) + '</div>';
  }
  return html + '</div>';
}
function renderGridList() {
  const grids = liveGrids();
  let html = '<button class="btn primary wide" data-act="newGrid">＋ Нова сітка</button>';
  if (!grids.length) return html + emptyState('▦', 'Сіток ще немає. Сітка — це 3 верхні речі, 3 верхи і 3 низи, розкладені як судоку: кожен рядок, стовпчик і діагональ дає образ.');
  html += '<div class="grid-list" style="margin-top:14px">';
  for (const g of grids) {
    const outs = gridOutfits(g), ok = outs.filter(o => o.status !== 'rejected').length;
    html += '<button class="card grid-card" data-act="openGrid" data-id="' + g.id + '">' + boardHtml(g, false) +
      '<div><b>' + esc(g.name || 'Сітка') + '</b><div class="muted" style="font-size:14px">' + ok + ' ' + plural(ok, 'образ', 'образи', 'образів') +
      ' · ' + g.categoryIds.map(catName).map(esc).join(', ') + '</div></div></button>';
  }
  return html + '</div>';
}
function renderGrid(g) {
  const outs = gridOutfits(g);
  const shown = outs.filter(o => o.status !== 'rejected');
  const rejected = outs.length - shown.length;
  const selItem = state.sel >= 0 ? byId(data.items, g.cells[state.sel]) : null;
  let html = boardHtml(g, true);
  if (state.sel >= 0) {
    html += '<div class="hint">' + (selItem ? esc(selItem.name || catName(selItem.categoryId)) + ' — ' : '') +
      'торкніться іншої клітинки, щоб поміняти місцями</div><div class="toolbar">' +
      '<button class="btn small" data-act="replaceCell">Замінити річ</button>' +
      (selItem ? '<button class="btn small" data-act="clearCell">Прибрати</button>' : '') +
      '<button class="btn small" data-act="unselect">Готово</button></div>';
  } else {
    html += '<div class="hint">Торкніться клітинки, щоб переставити або замінити річ.</div>' +
      '<div class="toolbar"><button class="btn small" data-act="randomGrid">🎲 Заповнити випадково</button></div>';
  }
  html += '<h2>Образи <span class="muted" style="font-weight:400">' + shown.length + (rejected ? ' · відхилено ' + rejected : '') + '</span></h2>';
  if (!shown.length) html += '<div class="muted">Поки що жоден рядок, стовпчик чи діагональ не має по одній речі кожної категорії. Переставте речі.</div>';
  for (const o of shown) html += outfitCard(o);
  html += '<div class="settings"><button class="btn" data-act="renameGrid">Перейменувати сітку <span>›</span></button>' +
    '<button class="btn danger" data-act="deleteGrid">Видалити сітку <span>›</span></button></div>';
  return html;
}
function outfitCard(o) {
  const n = o.items.length, today = wornToday(o.key);
  return '<div class="card outfit' + (state.hl === o.key ? ' hl' : '') + '">' +
    '<div class="mini small-pics" style="--n:' + n + '" data-act="hl" data-key="' + o.key + '">' + o.items.map(it => itemPic(it, 160)).join('') + '</div>' +
    '<div class="meta"><span>' + esc(o.line.label) + '</span>' + (o.status === 'favourite' ? '<span class="badge fav">★</span>' : '') +
    '<span>' + (o.last ? daysAgo(o.last) : '') + '</span>' + (o.results.length ? '<span>📷 ' + o.results.length + '</span>' : '') + '</div>' +
    '<div class="actions">' +
    '<button class="ico-btn' + (today ? ' on' : '') + '" data-act="wear" data-key="' + o.key + '" data-grid="' + o.grid.id + '">' + (today ? '✓ Сьогодні' : 'Одягаю') + '</button>' +
    '<button class="ico-btn fav' + (o.status === 'favourite' ? ' on' : '') + '" data-act="fav" data-key="' + o.key + '">★</button>' +
    '<button class="ico-btn" data-act="outfit" data-key="' + o.key + '">📷 Фото</button>' +
    '<button class="ico-btn" data-act="reject" data-key="' + o.key + '">✕</button></div></div>';
}

async function saveGridCells(g, cells) {
  const prev = g.cells;
  g.cells = cells; saveData(); render();
  try { await api('saveGrid', { grid: { id: g.id, cells } }); }
  catch (e) { g.cells = prev; saveData(); render(); }
}

function newGridDialog() {
  const cats = liveCats();
  const body = openDialog('Нова сітка',
    '<label>Назва<input class="field" id="gName" placeholder="Напр. Осінь, робота" value="Сітка ' + (data.grids.length + 1) + '"></label>' +
    '<div class="muted" style="font-size:14px">Категорії (скільки категорій — такого розміру сітка: 3 → 3×3, 4 → 4×4)</div>' +
    '<div class="row" id="gCats">' + cats.map((c, i) => '<button class="chip' + (i < 3 ? ' on' : '') + '" data-id="' + c.id + '"><i style="--c:' + catColor(c.id) + '"></i>' + esc(c.name) + '</button>').join('') + '</div>' +
    '<button class="btn" id="gRandom">🎲 Обрати речі випадково</button>' +
    '<div id="gPick"></div><div class="error" id="gErr"></div><button class="btn primary" id="gCreate">Створити</button>');
  const picked = {};
  const selected = () => [...body.querySelectorAll('#gCats .chip.on')].map(b => b.dataset.id);
  function drawPick() {
    const ids = selected(), n = ids.length;
    body.querySelector('#gPick').innerHTML = ids.map(cid => {
      const items = data.items.filter(i => i.categoryId === cid && !i.deleted);
      picked[cid] = (picked[cid] || []).filter(id => items.some(i => i.id === id)).slice(0, n);
      return '<h2 style="font-size:16px">' + esc(catName(cid)) + ' <span class="muted" style="font-weight:400">' + picked[cid].length + ' з ' + n + '</span></h2>' +
        (items.length ? '<div class="tiles">' + items.map(it => '<button class="tile' + (picked[cid].includes(it.id) ? ' in-grid' : '') + '" data-cat="' + cid + '" data-id="' + it.id + '">' +
          itemPic(it, 300) + '<span class="name">' + esc(it.name) + '</span></button>').join('') + '</div>'
          : '<div class="muted" style="font-size:14px">Речей цієї категорії ще немає — клітинки залишаться порожніми.</div>');
    }).join('');
    body.querySelectorAll('#gPick .tile').forEach(t => t.onclick = () => {
      const list = picked[t.dataset.cat];
      const at = list.indexOf(t.dataset.id);
      if (at >= 0) list.splice(at, 1); else if (list.length < selected().length) list.push(t.dataset.id); else { list.shift(); list.push(t.dataset.id); }
      drawPick();
    });
  }
  body.querySelectorAll('#gCats .chip').forEach(b => b.onclick = () => { b.classList.toggle('on'); drawPick(); });
  drawPick();
  body.querySelector('#gRandom').onclick = () => { const ids = selected(); Object.assign(picked, randomPick(ids, ids.length)); drawPick(); };
  body.querySelector('#gCreate').onclick = async () => {
    const ids = selected();
    if (ids.length < 2) { body.querySelector('#gErr').textContent = 'Оберіть щонайменше дві категорії.'; return; }
    const grid = { name: body.querySelector('#gName').value.trim() || 'Сітка', categoryIds: ids, cells: fillGrid(ids, picked) };
    const btn = body.querySelector('#gCreate'); btn.disabled = true;
    try {
      const saved = await api('saveGrid', { grid });
      upsertLocal('grids', 'id', saved);
      closeDialog();
      state.tab = 'grids'; store.set('tab', 'grids'); state.gridId = saved.id; state.sel = -1; state.hl = '';
      render();
    } catch (e) { btn.disabled = false; }
  };
}

function replaceCellDialog(g, i) {
  const current = byId(data.items, g.cells[i]);
  const order = current ? [current.categoryId].concat(g.categoryIds.filter(c => c !== current.categoryId)) : g.categoryIds;
  const body = openDialog('Замінити річ', order.map(cid => {
    const items = data.items.filter(it => it.categoryId === cid && !it.deleted);
    return '<h2 style="font-size:16px">' + esc(catName(cid)) + '</h2>' + (items.length ? '<div class="tiles">' + items.map(it => {
      const inGrid = g.cells.includes(it.id);
      return '<button class="tile' + (it.id === g.cells[i] ? ' in-grid' : '') + '" data-id="' + it.id + '"' + (inGrid && it.id !== g.cells[i] ? ' disabled' : '') + '>' +
        itemPic(it, 300) + '<span class="name">' + esc(it.name) + (inGrid && it.id !== g.cells[i] ? ' · вже в сітці' : '') + '</span></button>';
    }).join('') + '</div>' : '<div class="muted" style="font-size:14px">Немає речей.</div>');
  }).join('') + '<button class="btn" id="rAdd">＋ Додати нову річ</button>');
  body.querySelectorAll('.tile').forEach(t => t.onclick = () => {
    const cells = g.cells.slice(); cells[i] = t.dataset.id;
    closeDialog(); state.sel = -1; saveGridCells(g, cells);
  });
  body.querySelector('#rAdd').onclick = () => itemDialog(null, current ? current.categoryId : g.categoryIds[0]);
}

// ---------- outfit actions ----------
async function setStatus_(key, status, msg, undoStatus) {
  const prev = outfitRec(key).status;
  upsertLocal('outfits', 'key', { key, status });
  if (status === 'rejected' && state.hl === key) state.hl = '';
  render();
  try {
    await api('setOutfit', { key, status });
    if (msg) toast(msg, false, undoStatus != null ? () => setStatus_(key, undoStatus) : null);
  } catch (e) { upsertLocal('outfits', 'key', { key, status: prev }); render(); }
}
async function toggleWear(key, gridId) {
  const date = todayISO(), remove = wornToday(key);
  const before = data.worn.slice();
  if (remove) data.worn = data.worn.filter(w => !(w.outfitKey === key && w.date === date));
  else data.worn.push({ date, outfitKey: key, gridId });
  saveData(); render();
  try { await api('wear', { key, gridId, date, remove }, remove ? null : 'Гарного дня!'); }
  catch (e) { data.worn = before; saveData(); render(); }
}
async function addResult(key) {
  const photo = await pickPhoto();
  if (!photo) return;
  toast('Завантаження фото…');
  try {
    const rec = await api('addResult', { key, photo: { data: photo.data, type: photo.type } }, 'Фото збережено');
    const fileId = rec.resultFileIds[rec.resultFileIds.length - 1];
    previews[fileId] = photo.url;
    upsertLocal('outfits', 'key', rec);
    render();
    if ($('dlg').open && $('dlg').dataset.key === key) outfitDialog(key);
  } catch (e) { /* toast shown */ }
}
function outfitDialog(key) {
  const o = allOutfits().find(x => x.key === key);
  if (!o) return;
  const rec = outfitRec(key);
  const body = openDialog(o.line.label + ' · ' + (o.grid.name || ''), lookHtml(o) +
    '<div>' + outfitMeta(o) + '</div>' +
    '<h2 style="font-size:16px;margin:4px 0 0">Як це виглядає насправді</h2>' +
    ((rec.resultFileIds || []).length ? '<div class="results">' + rec.resultFileIds.slice().reverse().map(f =>
      '<button data-act="view" data-file="' + esc(f) + '"><div class="pic"><img loading="lazy" src="' + esc(thumbUrl(f, 400)) + '" alt=""></div></button>').join('') + '</div>'
      : '<div class="muted" style="font-size:14px">Ще немає фото. Одягніть образ і сфотографуйтеся в дзеркалі.</div>') +
    '<button class="btn primary" data-act="result" data-key="' + key + '">📷 Додати фото результату</button>' +
    '<div class="actions" style="margin-top:0"><button class="ico-btn fav' + (o.status === 'favourite' ? ' on' : '') + '" data-act="fav" data-key="' + key + '">★ Улюблений</button>' +
    '<button class="ico-btn" data-act="reject" data-key="' + key + '">✕ Не пропонувати</button></div>');
  $('dlg').dataset.key = key;
  bind(body);
}
$('dlg').addEventListener('close', () => { delete $('dlg').dataset.key; });

// ---------- items (admin) ----------
function renderItems() {
  const cats = liveCats();
  const list = data.items.filter(it => (state.showDeleted ? it.deleted : !it.deleted) && (!state.catFilter || it.categoryId === state.catFilter))
    .sort((a, b) => cats.findIndex(c => c.id === a.categoryId) - cats.findIndex(c => c.id === b.categoryId) || String(b.createdAt).localeCompare(String(a.createdAt)));
  let html = '<button class="btn primary wide" data-act="addItem">＋ Додати річ</button><div style="height:12px"></div>';
  html += '<div class="chips"><button class="chip' + (!state.catFilter ? ' on' : '') + '" data-act="filter" data-id="">Усі</button>' +
    cats.map(c => '<button class="chip' + (state.catFilter === c.id ? ' on' : '') + '" data-act="filter" data-id="' + c.id + '"><i style="--c:' + catColor(c.id) + '"></i>' +
      esc(c.name) + ' <span class="muted">' + data.items.filter(i => i.categoryId === c.id && !i.deleted).length + '</span></button>').join('') + '</div>';
  if (state.showDeleted) html += '<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Видалені речі</b><button class="btn small" data-act="toggleDeleted">Сховати</button></div>';
  html += list.length ? '<div class="tiles">' + list.map(it => '<button class="tile" data-act="editItem" data-id="' + it.id + '">' + itemPic(it, 300) +
    '<span class="name">' + esc(it.name || catName(it.categoryId)) + '</span></button>').join('') + '</div>'
    : '<div class="muted" style="padding:20px 0;text-align:center">' + (state.showDeleted ? 'Видалених речей немає.' : 'Тут поки порожньо.') + '</div>';
  const noPhoto = data.items.filter(i => !i.deleted && !i.fileId).length;
  const rejected = data.outfits.filter(o => o.status === 'rejected').length;
  const delGrids = data.grids.filter(g => g.deleted).length;
  html += '<div class="settings">' +
    (noPhoto ? '<div class="muted" style="font-size:14px">Без фото: ' + noPhoto + ' — торкніться речі, щоб додати фото.</div>' : '') +
    '<button class="btn" data-act="categories">Категорії <span>›</span></button>' +
    '<button class="btn" data-act="rejectedList">Відхилені образи <span class="muted">' + rejected + ' ›</span></button>' +
    '<button class="btn" data-act="deletedGrids">Видалені сітки <span class="muted">' + delGrids + ' ›</span></button>' +
    (state.showDeleted ? '' : '<button class="btn" data-act="toggleDeleted">Видалені речі <span class="muted">' + data.items.filter(i => i.deleted).length + ' ›</span></button>') +
    '</div>';
  return html;
}

function itemDialog(id, defaultCat) {
  const it = id ? byId(data.items, id) : null;
  const draft = { categoryId: it ? it.categoryId : (defaultCat || state.catFilter || (liveCats()[0] || {}).id), name: it ? it.name : '', photo: null };
  const returnToReplace = !!defaultCat && state.sel >= 0;
  const body = openDialog(it ? 'Річ' : 'Нова річ', '<div class="item-photo" id="iPic"></div>' +
    '<button class="btn" id="iPhoto">📷 ' + (it && it.fileId ? 'Змінити фото' : 'Зробити або обрати фото') + '</button>' +
    '<label>Назва<input class="field" id="iName" placeholder="Напр. Сірий светр" value="' + esc(draft.name) + '"></label>' +
    '<label>Категорія<select class="field" id="iCat">' + liveCats().concat(it && !liveCats().some(c => c.id === it.categoryId) ? [byId(data.categories, it.categoryId)] : [])
      .filter(Boolean).map(c => '<option value="' + c.id + '"' + (c.id === draft.categoryId ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></label>' +
    (it ? '' : '<div class="muted" style="font-size:13px">Фото можна додати пізніше — поки що буде тимчасова картинка.</div>') +
    '<button class="btn primary" id="iSave">Зберегти</button>' +
    (it ? '' : '<button class="btn" id="iSaveMore">Зберегти й додати ще</button>') +
    (it ? '<button class="btn ' + (it.deleted ? '' : 'danger') + '" id="iDel">' + (it.deleted ? 'Відновити' : 'Видалити') + '</button>' : ''));
  const drawPic = () => {
    const preview = Object.assign({}, it || {}, { categoryId: body.querySelector('#iCat').value, name: body.querySelector('#iName').value });
    if (draft.photo) { previews.__draft = draft.photo.url; preview.fileId = '__draft'; }
    body.querySelector('#iPic').innerHTML = itemPic(preview, 600);
  };
  drawPic();
  body.querySelector('#iName').oninput = drawPic;
  body.querySelector('#iCat').onchange = drawPic;
  body.querySelector('#iPhoto').onclick = async () => { const p = await pickPhoto(); if (p) { draft.photo = p; drawPic(); } };
  const save = async more => {
    const btns = body.querySelectorAll('button'); btns.forEach(b => b.disabled = true);
    const item = { id: it ? it.id : undefined, categoryId: body.querySelector('#iCat').value, name: body.querySelector('#iName').value.trim() };
    try {
      const saved = await api('saveItem', { item, photo: draft.photo ? { data: draft.photo.data, type: draft.photo.type } : null }, 'Збережено');
      if (draft.photo && saved.fileId) previews[saved.fileId] = draft.photo.url;
      upsertLocal('items', 'id', saved);
      render();
      if (more) itemDialog(null, item.categoryId);
      else if (returnToReplace && state.gridId) replaceCellDialog(byId(data.grids, state.gridId), state.sel);
      else closeDialog();
    } catch (e) { btns.forEach(b => b.disabled = false); }
  };
  body.querySelector('#iSave').onclick = () => save(false);
  if (!it) body.querySelector('#iSaveMore').onclick = () => save(true);
  if (it) body.querySelector('#iDel').onclick = async () => {
    try {
      const saved = await api('saveItem', { item: { id: it.id, deleted: !it.deleted } }, it.deleted ? 'Відновлено' : 'Видалено');
      upsertLocal('items', 'id', saved); closeDialog(); render();
    } catch (e) { /* toast shown */ }
  };
}

function categoriesDialog() {
  const cats = data.categories.slice().sort((a, b) => a.order - b.order);
  const body = openDialog('Категорії', '<div class="list">' + cats.map((c, i) =>
    '<div class="list-row"><i style="width:12px;height:12px;border-radius:50%;flex:none;background:' + catColor(c.id) + '"></i>' +
    '<input class="field" data-id="' + c.id + '" value="' + esc(c.name) + '"' + (c.deleted ? ' disabled' : '') + '>' +
    '<button class="btn small" data-up="' + i + '"' + (i ? '' : ' disabled') + '>↑</button>' +
    '<button class="btn small' + (c.deleted ? '' : ' danger') + '" data-del="' + c.id + '">' + (c.deleted ? '↺' : '✕') + '</button></div>').join('') + '</div>' +
    '<div class="list-row"><input class="field" id="cNew" placeholder="Нова категорія, напр. Аксесуари"><button class="btn" id="cAdd">Додати</button></div>' +
    '<div class="muted" style="font-size:13px">Колір категорії — мітка на фото. Видалена категорія зникає з вибору, речі в ній залишаються.</div>');
  const saveCat = async c => {
    try { upsertLocal('categories', 'id', await api('saveCategory', { category: c })); render(); categoriesDialog(); } catch (e) { /* toast shown */ }
  };
  body.querySelectorAll('input[data-id]').forEach(inp => inp.onchange = () => inp.value.trim() && saveCat({ id: inp.dataset.id, name: inp.value.trim() }));
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => saveCat({ id: b.dataset.del, deleted: !byId(data.categories, b.dataset.del).deleted }));
  body.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => {
    const i = Number(b.dataset.up), a = cats[i - 1], c = cats[i];
    try {
      const [x, y] = await Promise.all([api('saveCategory', { category: { id: c.id, order: a.order } }), api('saveCategory', { category: { id: a.id, order: c.order } })]);
      upsertLocal('categories', 'id', x); upsertLocal('categories', 'id', y); render(); categoriesDialog();
    } catch (e) { /* toast shown */ }
  });
  body.querySelector('#cAdd').onclick = () => { const v = body.querySelector('#cNew').value.trim(); if (v) saveCat({ name: v }); };
}

function rejectedDialog() {
  const rejected = data.outfits.filter(o => o.status === 'rejected');
  const body = openDialog('Відхилені образи', rejected.length ? rejected.map(o => {
    const items = o.key.split('+').map(id => byId(data.items, id));
    return '<div class="card outfit"><div class="mini small-pics" style="--n:' + items.length + '">' + items.map(it => itemPic(it, 160)).join('') + '</div>' +
      '<button class="btn small" data-act="unreject" data-key="' + o.key + '">Повернути</button></div>';
  }).join('') : '<div class="muted">Відхилених образів немає.</div>');
  bind(body);
}

function deletedGridsDialog() {
  const grids = data.grids.filter(g => g.deleted);
  const body = openDialog('Видалені сітки', grids.length ? grids.map(g =>
    '<div class="card grid-card">' + boardHtml(g, false) + '<div><b>' + esc(g.name) + '</b><div style="margin-top:8px"><button class="btn small" data-act="restoreGrid" data-id="' + g.id + '">Відновити</button></div></div></div>').join('')
    : '<div class="muted">Видалених сіток немає.</div>');
  bind(body);
}

// ---------- actions ----------
const ACTIONS = {
  goItems: () => { state.tab = 'items'; store.set('tab', 'items'); render(); },
  goGrids: () => { state.tab = 'grids'; store.set('tab', 'grids'); render(); },
  newGrid: newGridDialog,
  openGrid: d => { state.gridId = d.id; state.sel = -1; state.hl = ''; render(); window.scrollTo(0, 0); },
  cell: d => {
    const g = byId(data.grids, state.gridId), i = Number(d.i);
    if (state.sel < 0) { state.sel = i; state.hl = ''; render(); return; }
    if (state.sel === i) { state.sel = -1; render(); return; }
    const cells = g.cells.slice();
    [cells[state.sel], cells[i]] = [cells[i], cells[state.sel]];
    state.sel = -1;
    saveGridCells(g, cells);
  },
  randomGrid: async () => {
    const g = byId(data.grids, state.gridId), prev = g.cells.slice();
    state.hl = '';
    await saveGridCells(g, fillGrid(g.categoryIds, randomPick(g.categoryIds, g.categoryIds.length)));
    toast('Сітку заповнено випадково', false, () => saveGridCells(g, prev));
  },
  unselect: () => { state.sel = -1; render(); },
  replaceCell: () => replaceCellDialog(byId(data.grids, state.gridId), state.sel),
  clearCell: () => { const g = byId(data.grids, state.gridId), cells = g.cells.slice(); cells[state.sel] = ''; state.sel = -1; saveGridCells(g, cells); },
  hl: d => { state.hl = state.hl === d.key ? '' : d.key; state.sel = -1; render(); if (state.hl) window.scrollTo({ top: 0, behavior: 'smooth' }); },
  renameGrid: async () => {
    const g = byId(data.grids, state.gridId);
    const name = prompt('Назва сітки', g.name || '');
    if (name == null || !name.trim()) return;
    try { upsertLocal('grids', 'id', await api('saveGrid', { grid: { id: g.id, name: name.trim() } })); render(); } catch (e) { /* toast shown */ }
  },
  deleteGrid: async () => {
    const g = byId(data.grids, state.gridId);
    if (!confirm('Видалити сітку «' + (g.name || '') + '»? Її можна буде відновити в розділі «Речі».')) return;
    try { upsertLocal('grids', 'id', await api('saveGrid', { grid: { id: g.id, deleted: true } }, 'Сітку видалено')); state.gridId = null; render(); } catch (e) { /* toast shown */ }
  },
  restoreGrid: async d => {
    try { upsertLocal('grids', 'id', await api('saveGrid', { grid: { id: d.id, deleted: false } }, 'Відновлено')); render(); deletedGridsDialog(); } catch (e) { /* toast shown */ }
  },
  wear: d => toggleWear(d.key, d.grid || ''),
  fav: d => { const fav = outfitRec(d.key).status === 'favourite'; setStatus_(d.key, fav ? '' : 'favourite'); if ($('dlg').dataset.key === d.key) setTimeout(() => outfitDialog(d.key)); },
  reject: d => { closeDialog(); setStatus_(d.key, 'rejected', 'Цей образ більше не пропонуватиметься', outfitRec(d.key).status); },
  unreject: d => { setStatus_(d.key, ''); setTimeout(rejectedDialog); },
  result: d => addResult(d.key),
  outfit: d => outfitDialog(d.key),
  view: d => openViewer(d.file),
  nextSuggest: () => { state.suggest++; render(); },
  addItem: () => itemDialog(null),
  editItem: d => itemDialog(d.id),
  filter: d => { state.catFilter = d.id; render(); },
  toggleDeleted: () => { state.showDeleted = !state.showDeleted; render(); window.scrollTo(0, 0); },
  categories: categoriesDialog,
  rejectedList: rejectedDialog,
  deletedGrids: deletedGridsDialog,
};

// ---------- PWA / install ----------
if (API_URL && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const inAppsScript = !!(window.google && google.script && google.script.run);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; });

async function install() {
  // Google's page can't be installed (no manifest/service worker there): send to the PWA copy.
  if (inAppsScript) {
    const url = store.get('pwaUrl');
    if (url) { window.open(url, '_blank'); return; }
    if (!isIOS) {
      return openDialog('Встановити застосунок', '<p><b>Android (Chrome):</b></p><ol><li>Натисніть меню <b>⋮</b> (вгорі праворуч).</li>' +
        '<li>Оберіть <b>Додати на головний екран</b>, потім <b>Додати</b>.</li></ol>');
    }
  }
  if (installPrompt) {
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    if (outcome === 'accepted') installPrompt = null;
    return;
  }
  if (isIOS) {
    return openDialog('Встановити застосунок', '<ol><li>Відкрийте цю сторінку в <b>Safari</b>.</li>' +
      '<li>Натисніть <b>Поділитися</b> (квадрат зі стрілкою).</li>' +
      '<li>Прокрутіть і оберіть <b>На початковий екран</b>.</li><li>Натисніть <b>Додати</b>.</li></ol>');
  }
  if (!window.isSecureContext) {
    return openDialog('Встановити застосунок', '<p>Браузер встановлює застосунки лише за адресою <b>https://</b>.</p>');
  }
  openDialog('Встановити застосунок', '<ol><li>Відкрийте меню браузера (⋮ або ⋯).</li>' +
    '<li>Оберіть <b>Встановити застосунок</b> або <b>Додати на головний екран</b>.</li></ol>' +
    '<p class="muted">Якщо пункту немає, перезавантажте сторінку й спробуйте ще раз.</p>');
}
document.querySelectorAll('.install').forEach(b => b.addEventListener('click', install));

// ---------- start ----------
state.token ? showApp() : showLogin();
</script>
</body>
</html>
